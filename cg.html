<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Operator (CG) | SKAWAN TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { brand: ['Montserrat', 'sans-serif'], sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/webrtc-stream.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-ticker { display: inline-block; white-space: nowrap; animation: marquee 16s linear infinite; }
    .deck-btn { transition: all 0.12s ease; }
    .deck-btn:active { transform: scale(0.97); }
    video, iframe { transform: translateZ(0); backface-visibility: hidden; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-6">
  <nav class="bg-slate-950/95 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center font-brand font-black text-white">CG</div>
          <div>
            <div class="flex items-center gap-1.5"><span class="font-brand font-black text-white text-lg">SKAWAN</span><span class="font-brand font-black text-blue-500 text-lg">TV</span></div>
            <span class="text-[10px] uppercase text-slate-400 block">Character Generator Deck</span>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg text-xs">Ruangan: <span id="navDisplayToken" class="font-mono font-bold text-blue-400">SKASA</span></div>
        <button onclick="window.location.href='login.html'" class="bg-slate-800 text-xs px-3 py-1.5 rounded-lg">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-5 w-full flex-1 space-y-5">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      <!-- KIRI: PGM Live Preview dengan Visual Video Asli -->
      <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4 flex flex-col justify-between">
        <div class="space-y-3">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800 text-xs font-bold text-slate-200 uppercase">
            <span>Visual Program Preview (PGM Live)</span><span id="badgeCgPgmSource" class="font-mono px-2 py-0.5 rounded bg-red-950 text-red-300">CAM 1</span>
          </div>
          <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border-2 border-slate-800 flex items-center justify-center">
            <video id="cgLiveCamVideo" class="absolute inset-0 w-full h-full object-cover z-10 opacity-0 pointer-events-none" autoplay playsinline muted></video>
            <div id="cgFallbackScreen" class="text-center relative z-0"><span class="font-brand font-black text-2xl text-slate-500" id="cgFallbackSourceLabel">CAM 1</span></div>

            <!-- Lower Third Preview -->
            <div id="previewLowerThird" class="hidden absolute bottom-8 left-4 right-4 z-20">
              <div class="inline-block bg-gradient-to-r from-red-600 to-rose-600 text-white font-brand font-black text-xs px-3.5 py-1 rounded-t-lg" id="previewLtTitle">NAMA</div>
              <div class="bg-slate-950/95 border-l-4 border-red-500 text-slate-200 text-[11px] px-3.5 py-1 rounded-b-lg flex items-center justify-between">
                <span id="previewLtSubtitleText">Keterangan</span><span class="text-[9px] font-mono text-red-400 font-bold ml-2">LIVE</span>
              </div>
            </div>

            <!-- Bug Logo Preview -->
            <div id="previewBugLogo" class="hidden absolute top-3 right-3 z-30 flex items-center justify-center">
              <span class="text-[10px] font-brand font-black text-white bg-black/60 px-2 py-1 rounded">SKAWAN TV</span>
            </div>

            <!-- Ticker Preview -->
            <div id="previewTickerBar" class="hidden absolute bottom-0 left-0 right-0 h-6 bg-red-700 text-white z-20 overflow-hidden flex items-center">
              <div class="w-full overflow-hidden text-[10px]"><span id="previewTickerText" class="animate-ticker">Selamat Datang di SKAWAN TV</span></div>
            </div>
            
            <!-- Live Badge -->
            <div id="previewLiveBadge" class="hidden absolute top-3 left-3 bg-red-600 text-white text-[9px] font-bold px-2 py-0.5 rounded z-30 animate-pulse">LIVE</div>
          </div>
        </div>
        <button onclick="clearAllGraphics()" class="deck-btn w-full py-2.5 rounded-xl border border-rose-900/60 bg-rose-950/40 text-rose-300 font-bold text-xs">Hapus Semua Grafis (CLEAR DSK)</button>
      </div>

      <!-- KANAN: Kontrol CG -->
      <div class="lg:col-span-7 space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
          <h3 class="font-brand font-bold text-white text-sm">Lower Third Control</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Baris 1:</label>
              <input type="text" id="inputLtTitle" value="Dimas Pratama" oninput="sinkronInputPreview()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white outline-none">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Baris 2:</label>
              <input type="text" id="inputLtSubtitle" value="Presenter Utama" oninput="sinkronInputPreview()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-200 outline-none">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-1">
            <button onclick="toggleLowerThird(true)" class="deck-btn py-3 px-4 rounded-xl bg-blue-600 text-white font-bold text-xs">TAKE IN (ON-AIR)</button>
            <button onclick="toggleLowerThird(false)" class="deck-btn py-3 px-4 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">TAKE OUT (OFF)</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentRoomToken = 'SKASA';
    let cgState = { lowerThirdActive: false, title: "Dimas Pratama", subtitle: "Presenter", logoActive: false, logoUrl: "", isLiveBadgeActive: false, tickerActive: false, tickerText: "" };
    let currentLiveState = { programSource: 'cam_1', previewSource: 'cam_2' };
    const remoteCamStreams = new Map();
    let streamerInstance = null;

    function getDatabase() {
      return window.db || (typeof firebase !== 'undefined' ? firebase.database() : null);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentRoomToken = (urlParams.get('room') || sessionStorage.getItem('skawan_room') || 'SKASA').toUpperCase();
      document.getElementById('navDisplayToken').innerText = currentRoomToken;

      initCgSystem(currentRoomToken);
      sinkronInputPreview();
    });

    function initCgSystem(token) {
      const db = getDatabase();
      if (!db) return;

      db.ref(`rooms/${token}/live_state`).on('value', snap => {
        if (!snap.exists()) return;
        const live = snap.val();
        currentLiveState.programSource = live.programSource || 'cam_1';
        currentLiveState.previewSource = live.previewSource || 'cam_2';
        updateCgMonitors();
      });

      db.ref(`rooms/${token}/cg_state`).on('value', snap => {
        if (!snap.exists()) return;
        cgState = { ...cgState, ...snap.val() };
        updateCgUI();
      });

      if (typeof SkawanStreamer !== 'undefined') {
        streamerInstance = new SkawanStreamer({
          roomToken: token,
          roleKey: 'cg',
          onRemoteStream: (camKey, stream) => {
            const normKey = camKey.includes('_') ? camKey : camKey.replace('cam', 'cam_');
            remoteCamStreams.set(normKey, stream);
            updateCgMonitors();
          }
        });
      }
    }

    function updateCgMonitors() {
      const activeSrc = currentLiveState.programSource || 'cam_1';
      document.getElementById('badgeCgPgmSource').innerText = activeSrc.toUpperCase();
      document.getElementById('cgFallbackSourceLabel').innerText = activeSrc.toUpperCase();

      const camVideo = document.getElementById('cgLiveCamVideo');
      const fallbackScreen = document.getElementById('cgFallbackScreen');
      const stream = remoteCamStreams.get(activeSrc) || remoteCamStreams.get(activeSrc.replace('_', ''));

      if (stream && camVideo) {
        if (camVideo.srcObject !== stream) camVideo.srcObject = stream;
        camVideo.classList.remove('opacity-0', 'pointer-events-none');
        camVideo.classList.add('opacity-100');
        if (fallbackScreen) fallbackScreen.classList.add('hidden');
        camVideo.play().catch(() => {});
      } else {
        if (camVideo) { camVideo.classList.remove('opacity-100'); camVideo.classList.add('opacity-0', 'pointer-events-none'); }
        if (fallbackScreen) fallbackScreen.classList.remove('hidden');
      }
    }

    function sinkronInputPreview() {
      const title = document.getElementById('inputLtTitle').value.trim() || 'NAMA';
      const subtitle = document.getElementById('inputLtSubtitle').value.trim() || 'Keterangan';
      cgState.title = title;
      cgState.subtitle = subtitle;
      document.getElementById('previewLtTitle').innerText = title;
      document.getElementById('previewLtSubtitleText').innerText = subtitle;
    }

    function toggleLowerThird(isActive) {
      sinkronInputPreview();
      cgState.lowerThirdActive = isActive;
      updateCgUI();
      syncCgKeFirebase();
    }

    function clearAllGraphics() {
      cgState.lowerThirdActive = false;
      cgState.logoActive = false;
      cgState.tickerActive = false;
      updateCgUI();
      syncCgKeFirebase();
    }

    function updateCgUI() {
      const ltBox = document.getElementById('previewLowerThird');
      if (cgState.lowerThirdActive) ltBox.classList.remove('hidden'); else ltBox.classList.add('hidden');
    }

    function syncCgKeFirebase() {
      const db = getDatabase();
      if (!db) return;
      db.ref(`rooms/${currentRoomToken}/cg_state`).set({
        lowerThirdActive: cgState.lowerThirdActive,
        title: cgState.title,
        subtitle: cgState.subtitle,
        logoActive: cgState.logoActive,
        logoUrl: cgState.logoUrl || "",
        isLiveBadgeActive: Boolean(cgState.isLiveBadgeActive),
        tickerActive: cgState.tickerActive,
        tickerText: cgState.tickerText || "",
        updatedAt: Date.now()
      });
    }
  </script>
</body>
</html>
