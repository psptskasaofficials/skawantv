<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program Director (PD) Deck | SKAWAN TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { brand: ['Montserrat', 'sans-serif'], sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/webrtc-stream.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 16s linear infinite; }
    .deck-btn { transition: all 0.12s ease; }
    .deck-btn:active { transform: scale(0.97); }
    video, iframe { transform: translateZ(0); backface-visibility: hidden; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-6">
  <nav class="bg-slate-950/95 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-600 to-red-700 flex items-center justify-center font-brand font-black text-white">PD</div>
          <div>
            <div class="flex items-center gap-1"><span class="font-brand font-black text-white text-base">SKAWAN</span><span class="font-brand font-black text-rose-500 text-base">TV</span></div>
            <span class="text-[9px] uppercase text-slate-400 block">Program Director Deck</span>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="bukaModalCloseProgram()" class="deck-btn text-xs font-black text-white bg-red-600 px-3.5 py-1.5 rounded-xl">Close Program</button>
        <div class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg text-xs">Ruangan: <span id="navRoomToken" class="font-mono font-bold text-rose-400">SKASA</span></div>
        <button onclick="window.location.href='login.html'" class="bg-slate-800 text-xs px-3 py-1.5 rounded-lg">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-3 w-full flex-1 space-y-4">
    <!-- Dual Monitor PGM & PVW dengan Visual Video Asli -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-950 border-2 border-emerald-500 rounded-2xl p-3 shadow-xl space-y-2">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800 text-xs text-emerald-400 font-bold uppercase">
          <span>PREVIEW (PVW)</span><span id="badgePvwSource" class="font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-300">CAM 2</span>
        </div>
        <div class="aspect-video bg-black rounded-xl overflow-hidden relative flex items-center justify-center border border-slate-800">
          <video id="pvwCamVideo" class="absolute inset-0 w-full h-full object-cover z-10 opacity-0 pointer-events-none" autoplay playsinline muted></video>
          <div id="pvwFallbackBox" class="text-center relative z-0"><span id="pvwScreenLabel" class="font-brand font-black text-3xl text-slate-300">CAM 2</span></div>
        </div>
      </div>

      <div class="bg-slate-950 border-2 border-red-600 rounded-2xl p-3 shadow-2xl space-y-2">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800 text-xs text-red-500 font-bold uppercase">
          <span>PROGRAM (PGM) • ON-AIR</span><span id="badgePgmSource" class="font-mono px-2 py-0.5 rounded bg-red-950 text-red-300 animate-pulse">CAM 1</span>
        </div>
        <div class="aspect-video bg-black rounded-xl overflow-hidden relative flex items-center justify-center border border-slate-800">
          <video id="pgmCamVideo" class="absolute inset-0 w-full h-full object-cover z-10 opacity-0 pointer-events-none" autoplay playsinline muted></video>
          <div id="pgmFallbackBox" class="text-center relative z-0"><span id="pgmScreenLabel" class="font-brand font-black text-3xl text-red-500">CAM 1</span></div>
          <div id="pgmLowerThirdBox" class="hidden absolute bottom-7 left-3 right-3 z-30">
            <div id="pgmLtTitle" class="bg-red-600 text-white font-bold text-xs px-3 py-1 rounded-t-lg inline-block">NAMA</div>
            <div id="pgmLtSubtitle" class="bg-slate-950/95 border-l-4 border-red-500 text-slate-100 text-[11px] px-3 py-1 rounded-b-lg"><span>Keterangan</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Konsol Sutradara -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3.5">
      <h3 class="font-brand font-bold text-white text-xs uppercase">Pusat Komando Sutradara (Director Cues Deck)</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs font-bold">
        <button onclick="kirimKomando('Ready Cam 1', 'SWITCHER')" class="deck-btn py-2.5 px-3 rounded-xl bg-slate-800 text-slate-100 border border-slate-700">Ready Cam 1</button>
        <button onclick="kirimKomando('Ready Cam 2', 'SWITCHER')" class="deck-btn py-2.5 px-3 rounded-xl bg-slate-800 text-slate-100 border border-slate-700">Ready Cam 2</button>
        <button onclick="kirimKomando('CUT SEKARANG!', 'SWITCHER')" class="deck-btn py-2.5 px-3 rounded-xl bg-red-600 text-white font-black">CUT SEKARANG!</button>
      </div>
    </div>
  </main>

  <!-- Modal Close Program -->
  <div id="modalCloseProgram" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-red-600 rounded-3xl max-w-md w-full p-6 text-center shadow-2xl space-y-4 text-white">
      <h4 class="text-base font-bold">Tutup Program Siaran?</h4>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="tutupModalCloseProgram()" class="py-2.5 rounded-xl border border-slate-700">Batal</button>
        <button onclick="eksekusiCloseProgram()" class="py-2.5 rounded-xl bg-red-600 font-bold">Ya, Close</button>
      </div>
    </div>
  </div>

  <script>
    let currentRoomToken = 'SKASA';
    let liveState = { programSource: 'cam_1', previewSource: 'cam_2' };
    const remoteCamStreams = new Map();
    let streamerInstance = null;

    function getDatabase() {
      return window.db || (typeof firebase !== 'undefined' ? firebase.database() : null);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentRoomToken = (urlParams.get('room') || sessionStorage.getItem('skawan_room') || 'SKASA').toUpperCase();
      document.getElementById('navRoomToken').innerText = currentRoomToken;

      initPdSystem(currentRoomToken);
    });

    function initPdSystem(token) {
      const db = getDatabase();
      if (!db) return;

      db.ref(`rooms/${token}/live_state`).on('value', snap => {
        if (!snap.exists()) return;
        const remote = snap.val();
        liveState.programSource = remote.programSource || 'cam_1';
        liveState.previewSource = remote.previewSource || 'cam_2';
        updateMonitors();
      });

      db.ref(`rooms/${token}/cg_state`).on('value', snap => {
        if (!snap.exists()) return;
        applyCgOverlay(snap.val());
      });

      if (typeof SkawanStreamer !== 'undefined') {
        streamerInstance = new SkawanStreamer({
          roomToken: token,
          roleKey: 'pd',
          onRemoteStream: (camKey, stream) => {
            const normKey = camKey.includes('_') ? camKey : camKey.replace('cam', 'cam_');
            remoteCamStreams.set(normKey, stream);
            updateMonitors();
          }
        });
      }
    }

    function updateMonitors() {
      const activeSrc = liveState.programSource || 'cam_1';
      const pvwSrc = liveState.previewSource || 'cam_2';
      
      document.getElementById('badgePgmSource').innerText = activeSrc.toUpperCase();
      document.getElementById('pgmScreenLabel').innerText = activeSrc.toUpperCase();
      document.getElementById('badgePvwSource').innerText = pvwSrc.toUpperCase();
      document.getElementById('pvwScreenLabel').innerText = pvwSrc.toUpperCase();

      const pgmVideo = document.getElementById('pgmCamVideo');
      const pgmFallback = document.getElementById('pgmFallbackBox');
      const pgmStream = remoteCamStreams.get(activeSrc) || remoteCamStreams.get(activeSrc.replace('_', ''));

      if (pgmStream && pgmVideo) {
        if (pgmVideo.srcObject !== pgmStream) pgmVideo.srcObject = pgmStream;
        pgmVideo.classList.remove('opacity-0', 'pointer-events-none');
        pgmVideo.classList.add('opacity-100');
        if (pgmFallback) pgmFallback.classList.add('hidden');
        pgmVideo.play().catch(() => {});
      } else {
        if (pgmVideo) { pgmVideo.classList.remove('opacity-100'); pgmVideo.classList.add('opacity-0', 'pointer-events-none'); }
        if (pgmFallback) pgmFallback.classList.remove('hidden');
      }

      const pvwVideo = document.getElementById('pvwCamVideo');
      const pvwFallback = document.getElementById('pvwFallbackBox');
      const pvwStream = remoteCamStreams.get(pvwSrc) || remoteCamStreams.get(pvwSrc.replace('_', ''));

      if (pvwStream && pvwVideo) {
        if (pvwVideo.srcObject !== pvwStream) pvwVideo.srcObject = pvwStream;
        pvwVideo.classList.remove('opacity-0', 'pointer-events-none');
        pvwVideo.classList.add('opacity-100');
        if (pvwFallback) pvwFallback.classList.add('hidden');
        pvwVideo.play().catch(() => {});
      } else {
        if (pvwVideo) { pvwVideo.classList.remove('opacity-100'); pvwVideo.classList.add('opacity-0', 'pointer-events-none'); }
        if (pvwFallback) pvwFallback.classList.remove('hidden');
      }
    }

    function applyCgOverlay(cg) {
      const ltBox = document.getElementById('pgmLowerThirdBox');
      if (cg.lowerThirdActive) {
        ltBox.classList.remove('hidden');
        document.getElementById('pgmLtTitle').innerText = cg.title;
        document.getElementById('pgmLtSubtitle').firstElementChild.innerText = cg.subtitle;
      } else {
        ltBox.classList.add('hidden');
      }
    }

    function kirimKomando(pesan, target = 'ALL') {
      const db = getDatabase();
      if (!db) return;
      db.ref(`rooms/${currentRoomToken}/director_cues`).set({
        message: pesan,
        targetRole: target,
        timestamp: Date.now()
      });
    }

    function bukaModalCloseProgram() { document.getElementById('modalCloseProgram').classList.remove('hidden'); }
    function tutupModalCloseProgram() { document.getElementById('modalCloseProgram').classList.add('hidden'); }
    function eksekusiCloseProgram() {
      const db = getDatabase();
      if (!db) { tutupModalCloseProgram(); return; }
      db.ref(`rooms/${currentRoomToken}/meta/status`).set('standby');
      tutupModalCloseProgram();
    }
  </script>
</body>
</html>
