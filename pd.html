  <script>
    (function ensureFirebaseConnection() {

    function handleBrandLogoFallback(imgEl) {
      if (imgEl.src.indexOf('assets/img/') !== -1) {
        imgEl.src = 'logo-skawan-full.webp';
      } else {
        imgEl.style.display = 'none';
        const fallback = document.getElementById('brandFallbackBadge');
        if (fallback) fallback.classList.remove('hidden');
      }
    }

  <style>
    .deck-btn {
      transition: all 0.1s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .deck-btn:active {
      transform: scale(0.96);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .crisis-active-pulse {
      animation: pulse-ring 1s infinite ease-in-out;

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-orange-600 selection:text-white pb-6">
