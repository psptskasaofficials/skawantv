<body class="w-screen h-screen bg-black flex items-center justify-center relative select-none">

  <!-- Audio Element Master Studio -->
  <audio id="masterStudioAudio" autoplay playsinline></audio>

  <!-- MASTER VIEWPORT 16:9 CLEAN OUTPUT -->
  <div id="pgmMasterViewport" class="relative w-full aspect-video max-h-screen bg-black overflow-hidden flex items-center justify-center">

    <!-- 1. LAYER BUMPER PLAYOUT (7 DETIK AWAL) -->
    <div id="pgmBumperWrapper" class="absolute inset-0 w-full h-full bg-black z-20 broadcast-dissolve flex items-center justify-center" style="display: flex; opacity: 1;">
      <div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none flex items-center justify-center">

    <!-- 2. KARTU GLADI BERSIH OVERLAY -->
    <div id="pgmStandbyCardOverlay" class="absolute inset-0 z-25 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center text-center p-8 transition-opacity duration-300" style="display: none;">
      <div class="bg-slate-900/95 border-2 border-amber-500/50 rounded-3xl p-8 shadow-2xl max-w-lg w-full space-y-4">

          <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>

        </div>
        <div>

    <!-- 3. FEED KAMERA / SCREEN SHARE WEBRTC -->
    <video id="pgmCamVideo" class="absolute inset-0 w-full h-full object-cover z-10 transition-opacity duration-200 pointer-events-none" style="display: none; opacity: 0;" autoplay playsinline muted></video>

    <!-- 4. PEMUTAR VT MEDIA (YOUTUBE API NO-COOKIE) -->
    <div id="pgmVtWrapper" class="absolute inset-0 w-full h-full bg-black flex items-center justify-center z-10 transition-opacity duration-200 pointer-events-none" style="display: none; opacity: 0;">
      <div id="pgmBlackShield" class="absolute inset-0 bg-black z-15 pointer-events-none transition-opacity duration-300 opacity-0"></div>
      <div id="pgmVtYtWrap" class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none flex items-center justify-center">
        <div id="pgmMasterYtEl" class="w-[125%] h-[125%] max-w-none border-0 pointer-events-none transform origin-center"></div>
      </div>

    <!-- 5. CG BUG LOGO (MENDUKUNG 3 OPSI) -->
    <div id="cgBugLogo" class="absolute top-5 right-6 z-30 flex items-center justify-center max-w-[150px] max-h-14 transition-all duration-200 pointer-events-none">
      <img id="cgBugLogoCustomImg" src="" alt="Bug Logo" class="hidden h-10 w-auto object-contain drop-shadow-md">
      <div id="cgBugLogoDefaultBadge" class="flex items-center gap-2 bg-white/95 rounded-2xl px-3 py-1.5 shadow-xl backdrop-blur-sm border border-white/20">
        <img
          id="cgBugLogoDefaultImg"
          src="assets/img/logo-skawan-icon.webp"

        <div id="cgBugLogoTextFallback" class="hidden items-center gap-1.5 bg-black/60 backdrop-blur-sm px-2 py-1 rounded-md border border-white/20">
          <div class="w-4 h-4 rounded bg-orange-600 flex items-center justify-center text-[9px] font-black text-white">SK</div>
          <span class="text-[10px] font-brand font-black text-white uppercase tracking-widest">SKAWAN <span class="text-orange-500">TV</span></span>
        </div>

    <!-- 6. KOTAK MERAH "LIVE" ON-AIR -->
    <div id="badgeLiveOnAir" class="hidden absolute top-5 left-6 z-30 bg-red-600 text-white font-brand font-black text-xs sm:text-sm px-3.5 py-1.5 rounded-xl flex items-center gap-2 shadow-2xl animate-pulse">

    <!-- 7. CG LOWER THIRD -->

        NAMA PRESENTER
      </div>

        <span id="cgLtSubtitleText">Keterangan Jabatan</span>

      </div>
    </div>

    <!-- 8. CG TICKER BAR -->
    <div id="cgTickerBar" class="hidden absolute bottom-0 left-0 right-0 h-8 sm:h-9 bg-gradient-to-r from-orange-700 to-red-700 text-white z-30 overflow-hidden flex items-center border-t border-orange-500 shadow-2xl">
      <div id="liveTickerWibHeader" class="bg-slate-950 px-3.5 h-full flex items-center font-mono font-black text-xs text-amber-400 shrink-0 border-r border-orange-900 tracking-wider">
        00:00 WIB
      </div>
      <div class="w-full overflow-hidden text-xs sm:text-sm font-medium px-3">
        <span id="cgTickerText" class="marquee-text">Selamat Datang di Siaran SKAWAN TV Studio SMKN 1 Pacitan</span>
      </div>
    </div>

  </div>

  <!-- FLOATING HELPER (AUTO-HIDE SETELAH 3 DETIK) -->
  <div id="floatingControls" class="control-fade fixed bottom-4 right-4 z-50 flex items-center gap-2 opacity-90">
    <button id="btnFloatingAudioUnmute" onclick="bukaSuaraSiaran()" class="bg-slate-900/90 hover:bg-slate-800 text-white border border-slate-700 px-3.5 py-2 rounded-2xl shadow-2xl font-mono text-xs font-bold flex items-center gap-2 backdrop-blur-md transition">
      <span id="iconAudioState">🔇</span>
      <span id="lblAudioState">Buka Suara</span>
    </button>
    <button onclick="toggleNativeFullscreen()" class="bg-slate-900/90 hover:bg-slate-800 text-white border border-slate-700 px-3 py-2 rounded-2xl shadow-2xl font-mono text-xs font-bold backdrop-blur-md transition" title="Layar Penuh (F)">
      ⛶
    </button>
  </div>

  <script>
    let currentRoomToken = 'SKASA';
    let streamerInstance = null;
    const remoteCamStreams = new Map();

    let isAudioUnmuted = false;
    let currentActiveYtId = '';
    let serverClockOffset = 0;

    let masterYtPlayer = null;
    let isMasterYtReady = false;

    const DEFAULT_BUMPER_YT_ID = 'Jnp3esoHb9k';
    const ON_AIR_BUMPER_DURATION_MS = 7000;
    let onAirBumperPlayedForCurrentSession = false;
    let bumperCountdownTimer = null;
    let bumperProgressInterval = null;

    let currentRoomMeta = {
      status: 'live',
      programName: 'SKASA TV Live Broadcast',
      episode: 'Siaran Utama'
    };

    let liveState = {
      programSource: 'cam_1',
      previewSource: 'cam_2',
      tally: { cam_1: 'red', cam_2: 'green', cam_3: 'off' }
    };

    let latestVtState = { 
      status: 'playing', 
      startAt: Date.now(),
      startOffset: 0,
      totalDuration: 120,
      youtubeId: '', 
      url: '',
      sourceType: 'youtube',
      loopMode: 'playlist'
    };

    function getDatabase() {
      return window.db || (typeof firebase !== 'undefined' && firebase.database ? firebase.database() : null);
    }

    function extractCleanYtId(raw) {
      if (!raw) return '';
      const str = String(raw).trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
      const match = str.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : '';
    }

    function sendCommandToIframe(iframeEl, func, args = []) {
      if (iframeEl && iframeEl.contentWindow) {
        iframeEl.contentWindow.postMessage(JSON.stringify({
          event: 'command',
          func: func,
          args: args
        }), '*');
      }
    }

    function applyAudioState() {
      const bumperIframe = document.getElementById('pgmBumperIframe');
      const studioMicAudio = document.getElementById('masterStudioAudio');
      const activeSrc = liveState.programSource || 'cam_1';

      if (isAudioUnmuted) {
        if (studioMicAudio) studioMicAudio.muted = false;
        sendCommandToIframe(bumperIframe, 'unMute');
        sendCommandToIframe(bumperIframe, 'setVolume', [100]);

        if (masterYtPlayer && typeof masterYtPlayer.unMute === 'function') {
          if (activeSrc === 'vt') {
            masterYtPlayer.unMute();
            masterYtPlayer.setVolume(100);
          } else {
            masterYtPlayer.mute();
          }
        }
      } else {
        if (studioMicAudio) studioMicAudio.muted = true;
        sendCommandToIframe(bumperIframe, 'mute');
        if (masterYtPlayer && typeof masterYtPlayer.mute === 'function') {
          masterYtPlayer.mute();
        }
      }
    }

    function bukaSuaraSiaran() {
      isAudioUnmuted = !isAudioUnmuted;
      document.getElementById('iconAudioState').innerText = isAudioUnmuted ? '🔊' : '🔇';
      document.getElementById('lblAudioState').innerText = isAudioUnmuted ? 'Suara Aktif' : 'Buka Suara';
      applyAudioState();
    }

    window.addEventListener('click', () => {
      if (!isAudioUnmuted) bukaSuaraSiaran();
    }, { once: true });

    function toggleNativeFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    let hideTimer = null;
    const floatingBox = document.getElementById('floatingControls');
    function resetHideTimer() {
      if (!floatingBox) return;
      floatingBox.style.opacity = '0.9';
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        floatingBox.style.opacity = '0';
      }, 3000);
    }
    window.addEventListener('mousemove', resetHideTimer);
    resetHideTimer();

    function getLinearServerTime(vt) {
      if (!vt) return 0;
      const offset = (vt.startOffset !== undefined) ? vt.startOffset : (vt.currentTime || 0);
      if (vt.status !== 'playing') return offset;

      const serverNow = Date.now() + serverClockOffset;
      const baseStart = vt.startAt || vt.updatedAt || serverNow;
      const elapsed = Math.max(0, (serverNow - baseStart) / 1000);
      return offset + elapsed;
    }

    function calculateAbsoluteServerTime(vt) {
      if (!vt) return 0;
      const dur = (masterYtPlayer && typeof masterYtPlayer.getDuration === 'function' && masterYtPlayer.getDuration() > 0)
        ? masterYtPlayer.getDuration()
        : (vt.totalDuration || 0);

      const linearTime = getLinearServerTime(vt);
      const activeLoop = vt.loopMode || 'playlist';

      if (activeLoop === 'single' && dur > 0) {
        return linearTime % dur;
      }
      return dur > 0 ? Math.min(linearTime, dur) : linearTime;
    }

    function initMasterYtPlayer(initialYtId, initialTime) {
      if (typeof YT === 'undefined' || !YT.Player) return;
      if (masterYtPlayer && isMasterYtReady) return;
      if (!initialYtId) return;

      currentActiveYtId = initialYtId;
      masterYtPlayer = new YT.Player('pgmMasterYtEl', {
        height: '100%',
        width: '100%',
        host: 'https://www.youtube-nocookie.com',
        videoId: initialYtId,
        playerVars: {
          playsinline: 1,
          controls: 0,
          rel: 0,
          autoplay: 1,
          mute: isAudioUnmuted ? 0 : 1,
          modestbranding: 1,
          iv_load_policy: 3,
          disablekb: 1,
          fs: 0,
          start: Math.floor(initialTime),
          origin: window.location.origin || 'http://localhost'
        },
        events: {
          onReady: (e) => {
            isMasterYtReady = true;
            if (initialTime > 0) e.target.seekTo(initialTime, true);
            if (latestVtState.status === 'playing') e.target.playVideo();
            else e.target.pauseVideo();
            applyAudioState();
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              const shield = document.getElementById('pgmBlackShield');
              if (shield) shield.classList.add('opacity-0');
              applyAudioState();
            }
          }
        }
      });
    }

    window.onYouTubeIframeAPIReady = () => {
      const vidId = extractCleanYtId(latestVtState.youtubeId || latestVtState.url);
      if (vidId) {
        initMasterYtPlayer(vidId, calculateAbsoluteServerTime(latestVtState));
      }
    };

    function updateMonitors() {
      const bumperWrap = document.getElementById('pgmBumperWrapper');
      const bumperIframe = document.getElementById('pgmBumperIframe');
      const standbyOverlay = document.getElementById('pgmStandbyCardOverlay');
      const pgmVideo = document.getElementById('pgmCamVideo');
      const pgmVtWrap = document.getElementById('pgmVtWrapper');

      const effectiveStatus = (currentRoomToken === 'SKASA') ? 'live' : (currentRoomMeta.status || 'standby');

      // 1. OFF-AIR
      if (effectiveStatus === 'ended') {
        standbyOverlay.style.display = 'flex';
        document.getElementById('standbyOverlayToken').innerText = currentRoomToken;
        document.getElementById('standbyOverlayProgram').innerText = currentRoomMeta.programName || "Program Selesai";

        if (pgmVideo) { pgmVideo.style.display = 'none'; pgmVideo.style.opacity = '0'; pgmVideo.pause(); }
        if (pgmVtWrap) { pgmVtWrap.style.display = 'none'; pgmVtWrap.style.opacity = '0'; }
        if (bumperWrap) { bumperWrap.style.display = 'none'; bumperWrap.style.opacity = '0'; }
        if (bumperIframe) bumperIframe.src = 'about:blank';
        if (masterYtPlayer && isMasterYtReady) masterYtPlayer.pauseVideo();
        applyAudioState();
        return;
      }

      // 2. STANDBY GLADI BERSIH
      if (effectiveStatus !== 'live') {
        onAirBumperPlayedForCurrentSession = false;

        standbyOverlay.style.display = 'flex';
        document.getElementById('standbyOverlayToken').innerText = currentRoomToken;
        document.getElementById('standbyOverlayProgram').innerText = currentRoomMeta.programName || "Gladi Bersih Studio";

        bumperWrap.style.display = 'flex';
        bumperWrap.style.opacity = '1';
        document.getElementById('bumperTagOverlay').classList.add('hidden');
        document.getElementById('bumperProgressBarContainer').classList.add('hidden');

        const desiredBumperSrc = `https://www.youtube-nocookie.com/embed/${DEFAULT_BUMPER_YT_ID}?autoplay=1&mute=1&controls=0&rel=0&loop=1&playlist=${DEFAULT_BUMPER_YT_ID}&playsinline=1&enablejsapi=1&fs=0`;
        if (!bumperIframe.src || !bumperIframe.src.includes(DEFAULT_BUMPER_YT_ID)) {
          bumperIframe.src = desiredBumperSrc;
        }

        if (pgmVideo) { pgmVideo.style.display = 'none'; pgmVideo.style.opacity = '0'; }
        if (pgmVtWrap) { pgmVtWrap.style.display = 'none'; pgmVtWrap.style.opacity = '0'; }
        if (masterYtPlayer && isMasterYtReady) masterYtPlayer.pauseVideo();
        applyAudioState();
        return;
      }

      // 3. LIVE ON-AIR
      standbyOverlay.style.display = 'none';

      const activeSrc = liveState.programSource || 'cam_1';
      const stream = getCameraStream(activeSrc);
      const vtVidId = extractCleanYtId(latestVtState.youtubeId || latestVtState.url);
      const isVtActive = (activeSrc === 'vt' && vtVidId !== '');
      const isCamActive = (stream !== null);

      // KASUS 3A: BUMPER OPENING 7 DETIK
      if (!onAirBumperPlayedForCurrentSession) {
        onAirBumperPlayedForCurrentSession = true;

        bumperWrap.style.display = 'flex';
        bumperWrap.style.opacity = '1';

        const tagOverlay = document.getElementById('bumperTagOverlay');
        const pbContainer = document.getElementById('bumperProgressBarContainer');
        const pBar = document.getElementById('bumperProgressBar');
        const cdLbl = document.getElementById('lblBumperCountdown');

        if (tagOverlay) tagOverlay.classList.remove('hidden');
        if (pbContainer) pbContainer.classList.remove('hidden');

        bumperIframe.src = `https://www.youtube-nocookie.com/embed/${DEFAULT_BUMPER_YT_ID}?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&enablejsapi=1&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0`;

        const startTime = Date.now();
        if (bumperProgressInterval) clearInterval(bumperProgressInterval);
        bumperProgressInterval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const pct = Math.min(100, (elapsed / ON_AIR_BUMPER_DURATION_MS) * 100);
          if (pBar) pBar.style.width = `${pct}%`;
          if (cdLbl) cdLbl.innerText = `${Math.max(0, Math.ceil((ON_AIR_BUMPER_DURATION_MS - elapsed) / 1000))}s`;

          if (elapsed >= ON_AIR_BUMPER_DURATION_MS) {
            clearInterval(bumperProgressInterval);
            bumperProgressInterval = null;
          }
        }, 80);

        if (bumperCountdownTimer) clearTimeout(bumperCountdownTimer);
        bumperCountdownTimer = setTimeout(() => {
          if (tagOverlay) tagOverlay.classList.add('hidden');
          if (pbContainer) pbContainer.classList.add('hidden');
          updateMonitors();
        }, ON_AIR_BUMPER_DURATION_MS);

        applyAudioState();
        return;
      }

      // KASUS 3B: UMPAN VT AKTIF
      if (isVtActive) {
        bumperWrap.style.opacity = '0';
        setTimeout(() => { bumperWrap.style.display = 'none'; }, 800);

        if (pgmVideo) { pgmVideo.style.display = 'none'; pgmVideo.style.opacity = '0'; }
        if (pgmVtWrap) {
          pgmVtWrap.style.display = 'flex';
          pgmVtWrap.style.opacity = '1';
        }
        syncVtDisplay();
        applyAudioState();
        return;
      }

      // KASUS 3C: UMPAN KAMERA / SCREEN SHARE AKTIF
      if (isCamActive && pgmVideo) {
        bumperWrap.style.opacity = '0';
        setTimeout(() => { bumperWrap.style.display = 'none'; }, 800);

        if (pgmVtWrap) { pgmVtWrap.style.display = 'none'; pgmVtWrap.style.opacity = '0'; }
        if (pgmVideo.srcObject !== stream) pgmVideo.srcObject = stream;
        
        pgmVideo.style.objectFit = (activeSrc === 'sharescreen') ? 'contain' : 'cover';
        pgmVideo.style.display = 'block';
        pgmVideo.style.opacity = '1';
        pgmVideo.play().catch(() => {});
        applyAudioState();
        return;
      }

      // KASUS 3D: STANDBY JIKA BELUM ADA SUMBER
      if (pgmVideo) { pgmVideo.style.display = 'none'; pgmVideo.style.opacity = '0'; }
      if (pgmVtWrap) { pgmVtWrap.style.display = 'none'; pgmVtWrap.style.opacity = '0'; }
      
      bumperWrap.style.display = 'flex';
      bumperWrap.style.opacity = '1';
      document.getElementById('bumperTagOverlay').classList.add('hidden');
      document.getElementById('bumperProgressBarContainer').classList.add('hidden');

      const desiredBumperSrc = `https://www.youtube-nocookie.com/embed/${DEFAULT_BUMPER_YT_ID}?autoplay=1&mute=1&controls=0&rel=0&loop=1&playlist=${DEFAULT_BUMPER_YT_ID}&playsinline=1&enablejsapi=1&fs=0`;
      if (!bumperIframe.src || !bumperIframe.src.includes(DEFAULT_BUMPER_YT_ID)) {
        bumperIframe.src = desiredBumperSrc;
      }

      applyAudioState();
    }

    function getCameraStream(key) {
      if (!key) return null;
      if (remoteCamStreams.has(key)) return remoteCamStreams.get(key);
      const altKey = key.includes('_') ? key.replace('_', '') : (key === 'sharescreen' ? 'sharescreen' : key.replace('cam', 'cam_'));
      if (remoteCamStreams.has(altKey)) return remoteCamStreams.get(altKey);
      return null;
    }

    function syncVtDisplay() {
      const vidId = extractCleanYtId(latestVtState.youtubeId || latestVtState.url);
      if (!vidId) return;

      const isPlaying = latestVtState.status === 'playing';
      const targetTime = calculateAbsoluteServerTime(latestVtState);

      if (!isMasterYtReady || !masterYtPlayer) {
        initMasterYtPlayer(vidId, targetTime);
        return;
      }

      if (currentActiveYtId !== vidId) {
        currentActiveYtId = vidId;
        const shield = document.getElementById('pgmBlackShield');
        if (shield) shield.classList.remove('opacity-0');

        masterYtPlayer.loadVideoById({
          videoId: vidId,
          startSeconds: Math.floor(targetTime)
        });

        if (isPlaying) masterYtPlayer.playVideo();
        else masterYtPlayer.pauseVideo();
        applyAudioState();
        return;
      }

      const curState = (typeof masterYtPlayer.getPlayerState === 'function') ? masterYtPlayer.getPlayerState() : -1;
      if (isPlaying && curState !== YT.PlayerState.PLAYING) {
        masterYtPlayer.playVideo();
      } else if (!isPlaying && curState !== YT.PlayerState.PAUSED) {
        masterYtPlayer.pauseVideo();
      }

      const actualSec = (typeof masterYtPlayer.getCurrentTime === 'function') ? masterYtPlayer.getCurrentTime() : 0;
      if (Math.abs(actualSec - targetTime) > 3.0) {
        masterYtPlayer.seekTo(targetTime, true);
        if (isPlaying) masterYtPlayer.playVideo();
      }
    }

    function applyCgGraphics(cg) {
      if (!cg) return;

      const ltBox = document.getElementById('cgLowerThirdBox');
      const ltTitle = document.getElementById('cgLtTitle');
      const ltSub = document.getElementById('cgLtSubtitleText');
      const tickerBox = document.getElementById('cgTickerBar');
      const tickerText = document.getElementById('cgTickerText');
      const badgeLive = document.getElementById('badgeLiveOnAir');

      if (cg.lowerThirdActive) {
        if (ltBox) ltBox.classList.remove('hidden');
        if (ltTitle) ltTitle.innerText = cg.title || 'NAMA PRESENTER';
        if (ltSub) ltSub.innerText = cg.subtitle || 'Keterangan Jabatan';
      } else if (ltBox) ltBox.classList.add('hidden');

      renderLiveBugLogo(cg);

      if (cg.tickerActive) {
        if (tickerBox) tickerBox.classList.remove('hidden');
        if (tickerText) tickerText.innerText = cg.tickerText || 'SKAWAN TV Live Broadcast';
      } else if (tickerBox) tickerBox.classList.add('hidden');

      if (badgeLive) {
        const isLiveNow = (currentRoomToken === 'SKASA') || (currentRoomMeta.status === 'live');
        if (cg.isLiveBadgeActive && isLiveNow) badgeLive.classList.remove('hidden');
        else badgeLive.classList.add('hidden');
      }
    }

    function renderLiveBugLogo(cg) {
      const logoBox = document.getElementById('cgBugLogo');
      const logoCustomImg = document.getElementById('cgBugLogoCustomImg');
      const logoDefaultBadge = document.getElementById('cgBugLogoDefaultBadge');
      const defaultImg = document.getElementById('cgBugLogoDefaultImg');
      if (!logoBox) return;

      if (cg.logoActive === false) {
        logoBox.classList.add('hidden');
        return;
      }

      logoBox.classList.remove('hidden');
      const mode = parseInt(cg.logoMode) || 2;

      if (mode === 1) {
        // Mode 1: Logo Full Horizontal
        if (logoCustomImg) {
          logoCustomImg.src = 'assets/img/logo-skawan-full.webp';
          logoCustomImg.className = 'h-8 sm:h-10 w-auto max-w-[150px] object-contain drop-shadow-md bg-white/95 rounded-xl px-2.5 py-1 border border-white/20';
          logoCustomImg.onerror = () => { logoCustomImg.src = 'logo-skawan-full.webp'; };
          logoCustomImg.classList.remove('hidden');
        }
        if (logoDefaultBadge) logoDefaultBadge.classList.add('hidden');
      } else if (mode === 2) {
        // Mode 2: Icon Logo Monogram
        if (logoDefaultBadge) {
          logoDefaultBadge.classList.remove('hidden');
          if (defaultImg) {
            defaultImg.src = 'assets/img/logo-skawan-icon.webp';
            defaultImg.onerror = () => { defaultImg.src = 'logo-skawan-icon.webp'; };
          }
        }
        if (logoCustomImg) logoCustomImg.classList.add('hidden');
      } else if (mode === 3) {
        // Mode 3: Custom File / URL
        if (cg.logoUrl && cg.logoUrl.trim().length > 0) {
          if (logoCustomImg) {
            logoCustomImg.src = cg.logoUrl;
            logoCustomImg.className = 'h-8 sm:h-10 w-auto max-w-[140px] object-contain drop-shadow-md';
            logoCustomImg.classList.remove('hidden');
          }
          if (logoDefaultBadge) logoDefaultBadge.classList.add('hidden');
        } else {
          if (logoDefaultBadge) logoDefaultBadge.classList.remove('hidden');
          if (logoCustomImg) logoCustomImg.classList.add('hidden');
        }
      }
    }

    function startWibLiveClock() {
      const updateClock = () => {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('id-ID', {
          timeZone: 'Asia/Jakarta',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
        const clockEl = document.getElementById('liveTickerWibHeader');
        if (clockEl) clockEl.innerText = `${formatter.format(now).replace('.', ':')} WIB`;
      };
      updateClock();
      setInterval(updateClock, 1000);
    }

    function connectLiveRoom(token) {
      currentRoomToken = token.toUpperCase();
      document.title = `SKAWAN TV | PGM [${currentRoomToken}]`;

      const activeDb = getDatabase();
      if (!activeDb) {
        setTimeout(() => connectLiveRoom(token), 300);
        return;
      }

      activeDb.ref('.info/serverTimeOffset').on('value', snap => {
        serverClockOffset = snap.val() || 0;
      });

      activeDb.ref(`rooms/${currentRoomToken}`).on('value', snapshot => {
        if (!snapshot.exists()) {
          currentRoomMeta = { status: (currentRoomToken === 'SKASA' ? 'live' : 'ended') };
          updateMonitors();
          return;
        }

        const roomData = snapshot.val() || {};
        const meta = roomData.meta || roomData;

        currentRoomMeta = {
          ...meta,
          status: (currentRoomToken === 'SKASA') ? 'live' : (meta.status || 'standby'),
          programName: meta.programName || `Studio ${currentRoomToken}`
        };

        if (roomData.live_state) {
          liveState.programSource = roomData.live_state.programSource || liveState.programSource;
          liveState.previewSource = roomData.live_state.previewSource || liveState.previewSource;
        }
        if (roomData.vt_state) {
          latestVtState = { ...latestVtState, ...roomData.vt_state };
        }
        if (roomData.cg_state) {
          applyCgGraphics(roomData.cg_state);
        }

        updateMonitors();
      });

      if (typeof SkawanStreamer !== 'undefined') {
        try {
          streamerInstance = new SkawanStreamer({
            roomToken: currentRoomToken,
            roleKey: `live_pgm_${Math.random().toString(36).substring(2, 7)}`,
            onRemoteStream: (camKey, stream) => {
              if (camKey === 'audio_master' || camKey === 'audio_pgm') {
                const masterAudioEl = document.getElementById('masterStudioAudio');
                if (masterAudioEl && masterAudioEl.srcObject !== stream) {
                  masterAudioEl.srcObject = stream;
                  masterAudioEl.play().catch(() => {});
                  applyAudioState();
                }
                return;
              }

              const normKey = camKey.includes('_') ? camKey : (camKey === 'sharescreen' ? 'sharescreen' : camKey.replace('cam', 'cam_'));
              remoteCamStreams.set(normKey, stream);
              remoteCamStreams.set(camKey, stream);
              updateMonitors();
            }
          });
        } catch (e) {
          console.warn("WebRTC Streamer notice:", e);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetRoom = (urlParams.get('room') || localStorage.getItem('skawan_room') || 'SKASA').toUpperCase();

      startWibLiveClock();
      connectLiveRoom(targetRoom);
    });
  </script>
