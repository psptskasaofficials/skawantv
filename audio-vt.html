    // 1. Logika Pemutar Video VT
    function gantiKlipVt() {
      const select = document.getElementById('selectVtItem');
      const val = select.value;

      if (val === 'custom_drive') {
        bukaModalCustomDrive();
        return;
      }

      activeVtKey = val;
      const vt = vtCatalog[val];
      if (!vt) return;

      const video = document.getElementById('vtVideoElement');
      const ytWrapper = document.getElementById('ytPlayerWrapper');
      const curTimeDisplay = document.getElementById('displayVtCurrentTime');
      const durTimeDisplay = document.getElementById('displayVtDuration');
      const remTimeDisplay = document.getElementById('displayVtRemaining');
      const progressBar = document.getElementById('vtProgressBar');

      if (vt.type === 'youtube') {
        currentSourceType = 'youtube';
        video.pause();
        video.classList.add('hidden');
        ytWrapper.classList.remove('hidden');

        if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
          ytPlayer.cueVideoById(vt.youtubeId);
          setTimeout(() => {
            const dur = ytPlayer.getDuration() || vt.durationSec || 0;
            durTimeDisplay.innerText = formatTimecode(dur);
            remTimeDisplay.innerText = formatTimecode(dur);
          }, 800);
        }
      } else {
        currentSourceType = 'html5';
        if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
          ytPlayer.pauseVideo();
        }
        ytWrapper.classList.add('hidden');
        video.classList.remove('hidden');
        video.src = vt.url;
        video.load();
      }

      curTimeDisplay.innerText = "00:00";
      progressBar.value = 0;
      cueVtVideo();
    }

    function setupVideoListeners() {
      const video = document.getElementById('vtVideoElement');
      const curTimeDisplay = document.getElementById('displayVtCurrentTime');
      const durTimeDisplay = document.getElementById('displayVtDuration');
      const remTimeDisplay = document.getElementById('displayVtRemaining');
      const progressBar = document.getElementById('vtProgressBar');

      video.addEventListener('loadedmetadata', () => {
        if (currentSourceType === 'html5') {
          durTimeDisplay.innerText = formatTimecode(video.duration);
          remTimeDisplay.innerText = formatTimecode(video.duration);
        }
      });

      video.addEventListener('timeupdate', () => {
        if (currentSourceType !== 'html5') return;
        curTimeDisplay.innerText = formatTimecode(video.currentTime);
        const rem = Math.max(0, video.duration - video.currentTime);
        remTimeDisplay.innerText = formatTimecode(rem);

        if (video.duration) {
          progressBar.value = (video.currentTime / video.duration) * 100;
        }

        // Sinkronisasi timecode ke Firebase berkala jika sedang live
        if (isVtPlaying && isFirebaseReady && Math.floor(video.currentTime) % 2 === 0) {
          syncVtStateToFirebase('playing');
        }
      });

      video.addEventListener('ended', () => {
        if (currentSourceType === 'html5') {
          cueVtVideo();
        }
      });
    }

    // Interval pembacaan waktu untuk YouTube Player
    function startYtTimeUpdater() {
      if (ytTimeInterval) clearInterval(ytTimeInterval);
      ytTimeInterval = setInterval(() => {
        if (currentSourceType !== 'youtube' || !ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;

        const cur = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || (vtCatalog[activeVtKey]?.durationSec || 0);

        if (dur > 0) {
          document.getElementById('displayVtDuration').innerText = formatTimecode(dur);
          document.getElementById('displayVtCurrentTime').innerText = formatTimecode(cur);
          const rem = Math.max(0, dur - cur);
          document.getElementById('displayVtRemaining').innerText = formatTimecode(rem);
          document.getElementById('vtProgressBar').value = (cur / dur) * 100;
        }

        if (isVtPlaying && isFirebaseReady && Math.floor(cur) % 2 === 0) {
          syncVtStateToFirebase('playing');
        }
      }, 500);
    }

    function rollPlayVtVideo() {
      const video = document.getElementById('vtVideoElement');
      const overlay = document.getElementById('vtOverlayStatus');
      const btnRoll = document.getElementById('btnRollVt');

      if (currentSourceType === 'youtube') {
        if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
          ytPlayer.playVideo();
          isVtPlaying = true;
          overlay.classList.add('hidden');
          btnRoll.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-brand font-black py-3 rounded-xl text-xs flex flex-col items-center justify-center gap-1 transition active:scale-95 shadow-md shadow-emerald-600/30 animate-pulse";
          document.getElementById('vtOverlayText').innerText = "ROLLING (ON-AIR)";
          syncVtStateToFirebase('playing');
        } else {
          showNotice("YouTube Player", "Pemutar YouTube sedang memuat, silakan coba beberapa detik lagi.");
        }
      } else {
        video.play().then(() => {
          isVtPlaying = true;
          overlay.classList.add('hidden');
          btnRoll.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-brand font-black py-3 rounded-xl text-xs flex flex-col items-center justify-center gap-1 transition active:scale-95 shadow-md shadow-emerald-600/30 animate-pulse";
          document.getElementById('vtOverlayText').innerText = "ROLLING (ON-AIR)";
          syncVtStateToFirebase('playing');
        }).catch(err => {
          showNotice("Pemutar Video", "Gagal memutar video: " + err.message);
        });
      }
    }

    function pauseVtVideo() {
      const video = document.getElementById('vtVideoElement');
      const overlay = document.getElementById('vtOverlayStatus');
      const btnRoll = document.getElementById('btnRollVt');

      if (currentSourceType === 'youtube') {
        if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
          ytPlayer.pauseVideo();
        }
      } else {
        video.pause();
      }

      isVtPlaying = false;
      overlay.classList.remove('hidden');
      document.getElementById('vtOverlayText').innerText = "PAUSED";
      document.getElementById('vtOverlaySub').innerText = "Video dijeda sementara";
      btnRoll.className = "bg-amber-500 hover:bg-amber-600 text-white font-brand font-black py-3 rounded-xl text-xs flex flex-col items-center justify-center gap-1 transition active:scale-95 shadow-md shadow-amber-500/25";
      syncVtStateToFirebase('paused');
    }

    function cueVtVideo() {
      const video = document.getElementById('vtVideoElement');
      const overlay = document.getElementById('vtOverlayStatus');
      const btnRoll = document.getElementById('btnRollVt');

      if (currentSourceType === 'youtube') {
        if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
          ytPlayer.seekTo(0, true);
          ytPlayer.pauseVideo();
        }
      } else {
        video.pause();
        video.currentTime = 0;
      }

      isVtPlaying = false;
      overlay.classList.remove('hidden');
      document.getElementById('vtOverlayText').innerText = "CUE / STANDBY";
      document.getElementById('vtOverlaySub').innerText = "Siap Diputar (Roll VT)";
      btnRoll.className = "bg-amber-500 hover:bg-amber-600 text-white font-brand font-black py-3 rounded-xl text-xs flex flex-col items-center justify-center gap-1 transition active:scale-95 shadow-md shadow-amber-500/25";
      syncVtStateToFirebase('stopped');
    }

    function seekVtProgress(val) {
      if (currentSourceType === 'youtube') {
        if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
          const dur = ytPlayer.getDuration() || vtCatalog[activeVtKey]?.durationSec || 0;
          if (dur) ytPlayer.seekTo((val / 100) * dur, true);
        }
      } else {
        const video = document.getElementById('vtVideoElement');
        if (video.duration) {
          video.currentTime = (val / 100) * video.duration;
        }
      }
    }

    function syncVtStateToFirebase(status) {
      if (!isFirebaseReady) return;
      const video = document.getElementById('vtVideoElement');
      const activeObj = vtCatalog[activeVtKey] || {};
      let cur = 0;

      if (currentSourceType === 'youtube' && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
        cur = ytPlayer.getCurrentTime() || 0;
      } else {
        cur = video.currentTime || 0;
      }

      db.ref(`rooms/${currentRoomToken}/vt_state`).set({
        status: status,
        currentTime: cur,
        title: activeObj.title || 'VT Klip',
        sourceType: currentSourceType,
        url: currentSourceType === 'youtube' ? (activeObj.youtubeId || '') : (video.src || ''),
        updatedAt: Date.now()
      });
    }

    // 2. Logika Virtual Audio Mixing Console
    function updateAudioFader(channel, val) {
      const valDisplay = document.getElementById(`val-${channel}`);
      let dbVal = "-∞";

      if (val > 80) dbVal = `+${Math.round((val - 80) / 4)} dB`;
      else if (val > 40) dbVal = `0 dB`;
      else if (val > 0) dbVal = `-${Math.round((40 - val) / 2)} dB`;

      valDisplay.innerText = dbVal;

      if (channel === 'vt') {
        const video = document.getElementById('vtVideoElement');
        if (video) video.volume = isMutedState.vt ? 0 : val / 100;
        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
          if (isMutedState.vt) {
            ytPlayer.mute();
          } else {
            ytPlayer.unMute();
            ytPlayer.setVolume(val);
          }
        }
      }
    }

    function toggleMute(channel) {
      isMutedState[channel] = !isMutedState[channel];
      const btn = document.getElementById(`mute-${channel}`);

      if (isMutedState[channel]) {
        btn.className = "w-full py-1 text-[9px] font-mono font-black rounded bg-red-600 text-white shadow transition";
        btn.innerText = "MUTED";
      } else {
        btn.className = "w-full py-1 text-[9px] font-mono font-bold rounded bg-slate-800 text-slate-300 hover:bg-red-600 hover:text-white transition";
        btn.innerText = "MUTE";
      }

      if (channel === 'vt') {
        const video = document.getElementById('vtVideoElement');
        if (video) video.muted = isMutedState.vt;
        if (ytPlayer) {
          if (isMutedState.vt) {

            ytPlayer.unMute();
            const faderVal = parseInt(document.getElementById('fader-vt').value) || 85;
            ytPlayer.setVolume(faderVal);
          }
        }
      }
    }

    // 3. Modal Input Custom Google Drive File ID / YouTube URL
    function bukaModalCustomDrive() {
      document.getElementById('inputCustomVtTitle').value = '';
      document.getElementById('inputCustomDriveId').value = '';
      document.getElementById('customDriveModal').classList.remove('hidden');
    }

    function tutupModalCustomDrive() {
      document.getElementById('customDriveModal').classList.add('hidden');
    }

    // Helper untuk mengekstrak Video ID dari tautan YouTube
    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|live\/|watch\?.+&v=))([\w-]{11})/;
      const match = url.match(regExp);
      if (match && match[1]) return match[1];
      if (url.length === 11 && !url.includes('/') && !url.includes('.')) return url;
      return null;
    }

    function simpanCustomDriveVt() {
      const title = document.getElementById('inputCustomVtTitle').value.trim() || 'Klip Baru';
      const durationSec = parseInt(document.getElementById('inputCustomVtDuration').value) || 60;
      let rawInput = document.getElementById('inputCustomDriveId').value.trim();

      if (!rawInput) {
        showNotice("Peringatan", "Harap masukkan link YouTube atau Google Drive!", false);
        return;
      }

      const ytId = extractYouTubeId(rawInput);
      const uniqueKey = `vt_${Date.now()}`;
      let itemConfig = null;

      if (ytId) {
        // Mode Video YouTube
        itemConfig = {
          type: "youtube",
          title: title,
          youtubeId: ytId,
          durationSec: durationSec
        };
      } else {
        // Mode Video Google Drive / MP4
        let fileId = rawInput;
        const match = rawInput.match(/[-\w]{25,}/);
        if (match) fileId = match[0];
        const driveDirectUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

        itemConfig = {
          type: "html5",
          title: title,
          durationSec: durationSec,
          url: driveDirectUrl
        };
      }

      // Simpan ke katalog lokal
      vtCatalog[uniqueKey] = itemConfig;

      // Tambahkan item baru ke dropdown select secara dinamis
      const select = document.getElementById('selectVtItem');
      const newOption = document.createElement('option');
      newOption.value = uniqueKey;
      newOption.innerText = ytId ? `▶ [YouTube] ${title} (${formatTimecode(durationSec)})` : `📁 [Drive] ${title} (${formatTimecode(durationSec)})`;
      
      select.insertBefore(newOption, select.lastElementChild);
      select.value = uniqueKey;

      activeVtKey = uniqueKey;
      gantiKlipVt();

      // Sinkronkan ke Firebase jika database aktif
      if (isFirebaseReady) {
        db.ref(`rooms/${currentRoomToken}/vt_catalog/${uniqueKey}`).set({
          ...itemConfig,
          addedAt: Date.now()
        });
      }

      tutupModalCustomDrive();
      showNotice("Video Berhasil Dimuat", `Video "${title}" (${ytId ? 'YouTube' : 'Google Drive'}) siap diputar.`, true);
    }

    function keluarSesi() {
      sessionStorage.removeItem('skawan_role');
      window.location.href = 'index.html';
    }
