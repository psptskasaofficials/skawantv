<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKAWAN TV | Live Studio Broadcast Player</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Montserrat, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            brand: ['Montserrat', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            skawan: {
              red: '#E50914',
              redHover: '#C70812',
              darkBg: '#090D14',
              cardDark: '#121824',
              borderDark: '#1E293B',
              amberGold: '#F59E0B'
            }
          }
        }
      }
    }
  </script>

  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <!-- Native WebRTC Streamer & YouTube API -->
  <script src="js/webrtc-stream.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }
    @keyframes marquee-live {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee-live 18s linear infinite;
    }
    iframe.video-fit {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }
    video, iframe, #masterVtYtWrap iframe {
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="relative flex items-center justify-center w-screen h-screen bg-black select-none">

  <!-- ============================================== -->
  <!-- MASTER BROADCAST VIEWPORT (16:9 FULLSCREEN)    -->
  <!-- ============================================== -->
  <main id="mainBroadcastContainer" class="relative w-full h-full max-w-[100vw] max-h-[100vh] aspect-video bg-black overflow-hidden flex items-center justify-center">

    <!-- LAYER 1: KAMERA WEBRTC LIVE FEED -->
    <video id="masterCamVideo" class="absolute inset-0 z-10 object-cover w-full h-full pointer-events-none opacity-0 transition-opacity duration-300" autoplay playsinline muted></video>

    <!-- LAYER 2: VT PLAYOUT (YOUTUBE / HTML5 MP4 / GDRIVE) -->
    <div id="masterVtWrapper" class="absolute inset-0 z-10 flex items-center justify-center w-full h-full bg-black pointer-events-none opacity-0 transition-opacity duration-300">
      <video id="masterVtHtml5" class="absolute inset-0 object-contain w-full h-full pointer-events-none opacity-0" playsinline></video>
      <div id="masterVtYtWrap" class="absolute inset-0 w-full h-full pointer-events-none">
        <div id="masterVtYtEl" class="w-full h-full"></div>
      </div>
      <iframe id="masterVtGdrive" class="opacity-0 video-fit pointer-events-none" allow="autoplay"></iframe>
    </div>

    <!-- LAYER 3: FALLBACK CARD / STANDBY TEST PATTERN -->
    <div id="masterStandbyOverlay" class="absolute inset-0 z-0 flex flex-col items-center justify-center p-6 text-center bg-slate-950">
      <div class="flex items-center gap-2 mb-3">
        <span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>
        <span class="text-xs font-mono font-bold tracking-widest text-slate-400 uppercase">SKAWAN TV MASTER CONTROL</span>
      </div>
      <h1 class="font-brand font-black text-3xl sm:text-5xl text-white tracking-wider mb-2">SIARAN STANDBY</h1>
      <p id="lblStandbySource" class="font-mono text-xs sm:text-sm text-red-500 font-bold uppercase tracking-widest">MEMUAT FEED PROGRAM...</p>
    </div>

    <!-- ============================================== -->
    <!-- LAYER 4: CG GRAPHICS OVERLAY                   -->
    <!-- ============================================== -->

    <!-- BUG LOGO (POJOK KANAN ATAS) -->
    <div id="cgBugLogoContainer" class="hidden absolute top-5 right-6 z-30 flex items-center justify-center max-w-[150px] max-h-12 transition-all duration-300">
      <img id="cgBugLogoImg" src="" alt="Logo" class="hidden object-contain w-auto h-8 sm:h-10 drop-shadow-lg">
      <div id="cgBugLogoDefault" class="flex items-center gap-1.5 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg border border-white/20 shadow-xl">
        <div class="w-4 h-4 rounded bg-red-600 flex items-center justify-center text-[10px] font-black text-white">SK</div>
        <span class="font-brand font-black text-xs sm:text-sm text-white tracking-widest uppercase">SKAWAN <span class="text-red-500">TV</span></span>
      </div>
    </div>

    <!-- LENCANA LIVE (POJOK KIRI ATAS) -->
    <div id="cgLiveBadge" class="hidden absolute top-5 left-6 z-30 bg-red-600 text-white font-brand font-black text-[11px] sm:text-xs px-3 py-1 rounded-md shadow-2xl flex items-center gap-1.5 animate-pulse">
      <span class="w-2 h-2 bg-white rounded-full"></span> LIVE
    </div>

    <!-- LOWER THIRD (BAGIAN BAWAH KIRI) -->
    <div id="cgLowerThirdContainer" class="hidden absolute bottom-12 left-6 right-6 sm:right-auto sm:max-w-lg z-30 transition-all duration-500 transform translate-y-0">
      <div id="cgLtTitle" class="inline-block px-4 py-1.5 text-xs sm:text-sm font-brand font-black tracking-wide text-white rounded-t-xl bg-gradient-to-r from-red-600 via-rose-600 to-red-700 shadow-xl">
        NAMA TALENT
      </div>
      <div class="bg-slate-950/95 backdrop-blur-md border-l-4 border-red-500 text-slate-100 text-xs sm:text-sm font-medium px-4 py-2 rounded-b-xl rounded-tr-xl shadow-2xl flex items-center justify-between">
        <span id="cgLtSubtitle">Keterangan / Jabatan</span>
        <span class="ml-3 font-mono text-[10px] font-bold text-red-400 uppercase tracking-widest">ON-AIR</span>
      </div>
    </div>

    <!-- RUNNING TEXT / TICKER BAR (DASAR LAYAR) -->
    <div id="cgTickerContainer" class="hidden absolute bottom-0 left-0 right-0 h-7 bg-red-700 text-white z-30 overflow-hidden flex items-center border-t border-red-500 shadow-2xl">
      <div id="cgTickerWibTime" class="h-full px-3 text-[10px] font-mono font-black text-amber-400 bg-slate-950 flex items-center shrink-0 border-r border-red-900 uppercase">
        00:00 WIB
      </div>
      <div class="w-full overflow-hidden text-xs font-semibold tracking-wide">
        <span id="cgTickerText" class="animate-marquee">
          Selamat Datang di Siaran Simulasi Studio SKAWAN TV &bull; Praktik Broadcasting & Pertelevisian SMK Negeri 1 Pacitan
        </span>
      </div>
    </div>

  </main>

  <!-- ============================================== -->
  <!-- JAVASCRIPT MASTER PLAYOUT LOGIC                -->
  <!-- ============================================== -->
  <script>
    let currentRoomToken = 'SKASA';
    let masterLiveState = { programSource: 'cam_1', previewSource: 'cam_2' };
    
    let masterVtState = {
      status: 'playing',
      currentTime: 0,
      totalDuration: 120,
      title: 'SKAWAN TV Broadcast',
      sourceType: 'youtube',
      youtubeId: 'Jnp3esoHb9k',
      url: 'https://www.youtube.com/watch?v=Jnp3esoHb9k',
      updatedAt: Date.now()
    };

    let masterCgState = {
      lowerThirdActive: false,
      title: "",
      subtitle: "",
      logoActive: false,
      logoUrl: "",
      isLiveBadgeActive: false,
      tickerActive: false,
      tickerText: ""
    };

    let masterYtPlayer = null;
    let isMasterYtReady = false;
    let activeLoadedYtId = '';
    const remoteCamStreams = new Map();
    let streamerInstance = null;

    function getDatabase() {
      return window.db || (typeof firebase !== 'undefined' ? firebase.database() : null);
    }

    function extractCleanYtId(raw) {
      if (!raw) return 'Jnp3esoHb9k';
      const str = String(raw).trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
      const match = str.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : 'Jnp3esoHb9k';
    }

    function startMasterWibClock() {
      const updateClock = () => {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('id-ID', {
          timeZone: 'Asia/Jakarta',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
        const wibText = `${formatter.format(now).replace('.', ':')} WIB`;
        const el = document.getElementById('cgTickerWibTime');
        if (el) el.innerText = wibText;
      };
      updateClock();
      setInterval(updateClock, 1000);
    }

    // ============================================================
    // INITIALIZE YOUTUBE PLAYER DENGAN INDEPENDENT AUTO-RESUME
    // ============================================================
    function initMasterYtPlayer() {
      if (isMasterYtReady && masterYtPlayer) return;
      if (typeof YT === 'undefined' || !YT.Player) return;

      const vidId = extractCleanYtId(masterVtState.youtubeId || masterVtState.url);

      try {
        masterYtPlayer = new YT.Player('masterVtYtEl', {
          height: '100%',
          width: '100%',
          host: 'https://www.youtube-nocookie.com',
          videoId: vidId,
          playerVars: {
            playsinline: 1,
            controls: 0,
            rel: 0,
            autoplay: 1,
            mute: 0,
            modestbranding: 1,
            disablekb: 1,
            origin: window.location.origin || 'http://localhost'
          },
          events: {
            onReady: (e) => {
              isMasterYtReady = true;
              activeLoadedYtId = vidId;

              // Hitung waktu saat ini berdasarkan timestamp jika video sedang playing
              let targetTime = masterVtState.currentTime || 0;
              if (masterVtState.status === 'playing' && masterVtState.updatedAt) {
                const elapsed = Math.max(0, (Date.now() - masterVtState.updatedAt) / 1000);
                targetTime = (targetTime + elapsed) % (masterVtState.totalDuration || 120);
              }

              if (targetTime > 0) {
                e.target.seekTo(targetTime, true);
              }

              if (masterVtState.status === 'playing') {
                e.target.playVideo();
              } else {
                e.target.pauseVideo();
              }
              syncMasterViewport();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) {
                e.target.seekTo(0, true);
                if (masterVtState.status === 'playing') e.target.playVideo();
              }
            }
          }
        });
      } catch (err) {
        console.warn("[Master Index] Init YT Player failed:", err);
      }
    }

    if (window.YT && window.YT.Player) {
      initMasterYtPlayer();
    } else {
      window.onYouTubeIframeAPIReady = initMasterYtPlayer;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentRoomToken = (urlParams.get('room') || sessionStorage.getItem('skawan_room') || 'SKASA').toUpperCase();

      startMasterWibClock();
      initMasterEngine(currentRoomToken);
    });

    // ============================================================
    // FIREBASE LISTENERS & ARSITEKTUR INDEPENDENT MASTER
    // ============================================================
    function initMasterEngine(token) {
      const db = getDatabase();
      if (!db) return;

      // 1. Live State Listener (PGM / PVW routing)
      db.ref(`rooms/${token}/live_state`).on('value', snap => {
        if (!snap.exists()) return;
        const live = snap.val();
        masterLiveState.programSource = live.programSource || masterLiveState.programSource;
        masterLiveState.previewSource = live.previewSource || masterLiveState.previewSource;
        syncMasterViewport();
      });

      // 2. VT State Listener (Anti-Reset Filter)
      db.ref(`rooms/${token}/vt_state`).on('value', snap => {
        if (!snap.exists()) return;
        const incoming = snap.val();
        const incomingId = extractCleanYtId(incoming.youtubeId || incoming.url);

        // Hitung waktu sesungguhnya yang berjalan di udara
        let calculatedTime = incoming.currentTime || 0;
        if (incoming.status === 'playing' && incoming.updatedAt) {
          const elapsed = Math.max(0, (Date.now() - incoming.updatedAt) / 1000);
          calculatedTime = (calculatedTime + elapsed) % (incoming.totalDuration || 120);
        }

        const isSameClip = (incomingId === activeLoadedYtId);

        // JIKA KLIP BERBEDA: Muat klip baru
        if (!isSameClip) {
          activeLoadedYtId = incomingId;
          masterVtState = { ...masterVtState, ...incoming, currentTime: calculatedTime };

          if (isMasterYtReady && masterYtPlayer && typeof masterYtPlayer.loadVideoById === 'function') {
            masterYtPlayer.loadVideoById({ videoId: incomingId, startSeconds: calculatedTime });
            if (incoming.status === 'playing') {
              masterYtPlayer.playVideo();
            } else {
              masterYtPlayer.pauseVideo();
            }
          }
        } else {
          // KLIP SAMA: Lakukan pengecekan drift tolerance
          masterVtState.status = incoming.status;
          masterVtState.totalDuration = incoming.totalDuration || masterVtState.totalDuration;

          if (isMasterYtReady && masterYtPlayer && typeof masterYtPlayer.getCurrentTime === 'function') {
            const currentLocalTime = masterYtPlayer.getCurrentTime() || 0;
            const timeDiff = Math.abs(currentLocalTime - calculatedTime);

            // HANYA seek jika selisih waktu lebih dari 5 detik (menghindari lompat ke 0 saat operator me-refresh)
            if (timeDiff > 5.0) {
              masterYtPlayer.seekTo(calculatedTime, true);
            }

            if (incoming.status === 'playing') {
              if (masterYtPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
                masterYtPlayer.playVideo();
              }
            } else {
              if (masterYtPlayer.getPlayerState() !== YT.PlayerState.PAUSED) {
                masterYtPlayer.pauseVideo();
              }
            }
          }
        }

        syncMasterViewport();
      });

      // 3. CG State Listener (Overlay Grafis)
      db.ref(`rooms/${token}/cg_state`).on('value', snap => {
        if (!snap.exists()) return;
        masterCgState = { ...masterCgState, ...snap.val() };
        renderCgLayers();
      });

      // 4. WebRTC Streamer untuk Kamera Kru
      if (typeof SkawanStreamer !== 'undefined') {
        streamerInstance = new SkawanStreamer({
          roomToken: token,
          roleKey: 'program_out',
          onRemoteStream: (camKey, stream) => {
            const normKey = camKey.includes('_') ? camKey : camKey.replace('cam', 'cam_');
            remoteCamStreams.set(normKey, stream);
            remoteCamStreams.set(camKey, stream);
            syncMasterViewport();
          }
        });
      }
    }

    // ============================================================
    // SINKRONISASI TAMPILAN VIEWPORT PGM
    // ============================================================
    function syncMasterViewport() {
      const activeSrc = masterLiveState.programSource || 'cam_1';
      const camVideo = document.getElementById('masterCamVideo');
      const vtWrapper = document.getElementById('masterVtWrapper');
      const standbyOverlay = document.getElementById('masterStandbyOverlay');
      const standbyLbl = document.getElementById('lblStandbySource');

      if (standbyLbl) standbyLbl.innerText = `SUMBER AKTIF: ${activeSrc.toUpperCase().replace('_', ' ')}`;

      if (activeSrc === 'vt') {
        // Alihkan ke VT Media
        if (camVideo) {
          camVideo.classList.remove('opacity-100');
          camVideo.classList.add('opacity-0');
        }
        if (standbyOverlay) standbyOverlay.classList.add('hidden');
        if (vtWrapper) {
          vtWrapper.classList.remove('opacity-0');
          vtWrapper.classList.add('opacity-100');
        }
      } else {
        // Alihkan ke Kamera Live Stream
        if (vtWrapper) {
          vtWrapper.classList.remove('opacity-100');
          vtWrapper.classList.add('opacity-0');
        }

        const stream = remoteCamStreams.get(activeSrc) || remoteCamStreams.get(activeSrc.replace('_', ''));
        if (stream && camVideo) {
          if (camVideo.srcObject !== stream) camVideo.srcObject = stream;
          camVideo.classList.remove('opacity-0');
          camVideo.classList.add('opacity-100');
          if (standbyOverlay) standbyOverlay.classList.add('hidden');
          camVideo.play().catch(() => {});
        } else {
          if (camVideo) {
            camVideo.classList.remove('opacity-100');
            camVideo.classList.add('opacity-0');
          }
          if (standbyOverlay) standbyOverlay.classList.remove('hidden');
        }
      }
    }

    // ============================================================
    // RENDER GRAFIS CG (Lower Third, Bug Logo, Live Badge, Ticker)
    // ============================================================
    function renderCgLayers() {
      // Lower Third
      const ltBox = document.getElementById('cgLowerThirdContainer');
      if (masterCgState.lowerThirdActive) {
        ltBox.classList.remove('hidden');
        document.getElementById('cgLtTitle').innerText = masterCgState.title || 'NAMA TALENT';
        document.getElementById('cgLtSubtitle').innerText = masterCgState.subtitle || 'Keterangan';
      } else {
        ltBox.classList.add('hidden');
      }

      // Bug Logo
      const logoBox = document.getElementById('cgBugLogoContainer');
      const logoImg = document.getElementById('cgBugLogoImg');
      const logoDef = document.getElementById('cgBugLogoDefault');
      if (masterCgState.logoActive) {
        logoBox.classList.remove('hidden');
        if (masterCgState.logoUrl && masterCgState.logoUrl.trim().length > 0) {
          logoImg.src = masterCgState.logoUrl;
          logoImg.classList.remove('hidden');
          logoDef.classList.add('hidden');
        } else {
          logoImg.classList.add('hidden');
          logoDef.classList.remove('hidden');
        }
      } else {
        logoBox.classList.add('hidden');
      }

      // Live Badge
      const liveBadge = document.getElementById('cgLiveBadge');
      if (masterCgState.isLiveBadgeActive) {
        liveBadge.classList.remove('hidden');
      } else {
        liveBadge.classList.add('hidden');
      }

      // Ticker / Running Text
      const tickerBox = document.getElementById('cgTickerContainer');
      if (masterCgState.tickerActive) {
        tickerBox.classList.remove('hidden');
        document.getElementById('cgTickerText').innerText = masterCgState.tickerText || 'SKAWAN TV Live Broadcast';
      } else {
        tickerBox.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
