<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Switcher (ATEM Desk) | SKAWAN TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            brand: ['Montserrat', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            skawan: { red: '#E50914', darkBg: '#090D14', cardDark: '#121824', borderDark: '#1E293B' }
          }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/webrtc-stream.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    .atem-btn { transition: all 0.1s ease; user-select: none; }
    .atem-btn:active { transform: scale(0.96); }
    .btn-pgm-active { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%) !important; color: #fff !important; box-shadow: 0 0 18px rgba(239, 68, 68, 0.85); }
    .btn-pvw-active { background: linear-gradient(180deg, #10b981 0%, #047857 100%) !important; color: #fff !important; box-shadow: 0 0 18px rgba(16, 185, 129, 0.75); }
    iframe.video-fit { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    video, iframe { transform: translateZ(0); backface-visibility: hidden; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-6">
  <nav class="bg-slate-950/95 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-red-600 to-rose-600 flex items-center justify-center font-brand font-black text-white">SW</div>
          <div>
            <div class="flex items-center gap-1"><span class="font-brand font-black text-white text-base">SKAWAN</span><span class="font-brand font-black text-red-500 text-base">TV</span></div>
            <span class="text-[9px] uppercase text-slate-400 block">ATEM Mini Pro Video Switcher</span>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg text-xs">Ruangan: <span id="navRoomToken" class="font-mono font-bold text-red-400">SKASA</span></div>
        <button onclick="bukaModalKeluar()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-3 w-full flex-1 space-y-4">
    <!-- Dual Monitor -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Preview -->
      <div class="bg-slate-950 border-2 border-emerald-500 rounded-2xl p-3 shadow-xl space-y-2">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800 text-xs text-emerald-400 font-bold uppercase">
          <span>PREVIEW (PVW)</span><span id="badgePvwSource" class="font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-300">CAM 2</span>
        </div>
        <div class="aspect-video bg-black rounded-xl overflow-hidden relative flex items-center justify-center border border-slate-800">
          <video id="pvwCamVideo" class="absolute inset-0 w-full h-full object-cover z-10 opacity-0 pointer-events-none" autoplay playsinline muted></video>
          <div id="pvwFallbackBox" class="text-center relative z-0"><span id="pvwScreenLabel" class="font-brand font-black text-3xl text-slate-300">CAM 2</span></div>
        </div>
      </div>

      <!-- Program -->
      <div class="bg-slate-950 border-2 border-red-600 rounded-2xl p-3 shadow-2xl space-y-2">
        <div class="flex items-center justify-between pb-1 border-b border-slate-800 text-xs text-red-500 font-bold uppercase">
          <span>PROGRAM (PGM) • ON-AIR</span><span id="badgePgmSource" class="font-mono px-2 py-0.5 rounded bg-red-950 text-red-300 animate-pulse">CAM 1</span>
        </div>
        <div class="aspect-video bg-black rounded-xl overflow-hidden relative flex items-center justify-center border border-slate-800">
          <video id="pgmCamVideo" class="absolute inset-0 w-full h-full object-cover z-10 opacity-0 pointer-events-none" autoplay playsinline muted></video>
          <!-- Layer VT di PGM Switcher -->
          <div id="pgmVtWrapper" class="absolute inset-0 w-full h-full bg-black flex items-center justify-center z-10 opacity-0 pointer-events-none">
            <div id="pgmVtYtWrap" class="absolute inset-0 w-full h-full pointer-events-none"><div id="pgmVtYtEl" class="w-full h-full"></div></div>
          </div>
          <div id="pgmFallbackBox" class="text-center relative z-0"><span id="pgmScreenLabel" class="font-brand font-black text-3xl text-red-500">CAM 1</span></div>
          
          <!-- CG Overlay -->
          <div id="pgmLowerThirdBox" class="hidden absolute bottom-7 left-3 right-3 z-30">
            <div id="pgmLtTitle" class="bg-red-600 text-white font-bold text-xs px-3 py-1 rounded-t-lg inline-block">NAMA</div>
            <div id="pgmLtSubtitle" class="bg-slate-950/95 border-l-4 border-red-500 text-slate-100 text-[11px] px-3 py-1 rounded-b-lg"><span>Keterangan</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ATEM Control Desk -->
    <div class="bg-slate-950 border-2 border-slate-800 rounded-2xl p-4 shadow-2xl space-y-4">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-8 space-y-3">
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5">
            <span class="text-[10px] font-mono font-bold text-red-400 uppercase">PROGRAM BUS</span>
            <div class="grid grid-cols-4 gap-2">
              <button id="btn-pgm-cam_1" onclick="pilihBusLangsung('pgm', 'cam_1')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">CAM 1</button>
              <button id="btn-pgm-cam_2" onclick="pilihBusLangsung('pgm', 'cam_2')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">CAM 2</button>
              <button id="btn-pgm-cam_3" onclick="pilihBusLangsung('pgm', 'cam_3')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">CAM 3</button>
              <button id="btn-pgm-vt" onclick="pilihBusLangsung('pgm', 'vt')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">VT</button>
            </div>
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5">
            <span class="text-[10px] font-mono font-bold text-emerald-400 uppercase">PREVIEW BUS</span>
            <div class="grid grid-cols-4 gap-2">
              <button id="btn-pvw-cam_1" onclick="pilihBusLangsung('pvw', 'cam_1')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">CAM 1</button>
              <button id="btn-pvw-cam_2" onclick="pilihBusLangsung('pvw', 'cam_2')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">CAM 2</button>
              <button id="btn-pvw-cam_3" onclick="pilihBusLangsung('pvw', 'cam_3')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">CAM 3</button>
              <button id="btn-pvw-vt" onclick="pilihBusLangsung('pvw', 'vt')" class="atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 font-bold text-xs text-slate-200">VT</button>
            </div>
          </div>
        </div>
        <div class="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col justify-between space-y-3">
          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="eksekusiCut()" class="atem-btn py-5 rounded-xl bg-gradient-to-b from-red-600 to-rose-700 text-white font-bold text-lg shadow-lg border border-red-400">CUT</button>
            <button onclick="eksekusiAuto()" class="atem-btn py-5 rounded-xl bg-gradient-to-b from-slate-800 to-slate-900 text-emerald-400 font-bold text-lg shadow-lg border border-emerald-500/40">AUTO</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentRoomToken = 'SKASA';
    let liveState = { programSource: 'cam_1', previewSource: 'cam_2' };
    let latestVtState = { status: 'playing', currentTime: 0, totalDuration: 120, youtubeId: 'Jnp3esoHb9k', sourceType: 'youtube' };
    const remoteCamStreams = new Map();
    let streamerInstance = null;
    let switcherPgmYt = null;

    function getDatabase() {
      return window.db || (typeof firebase !== 'undefined' ? firebase.database() : null);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentRoomToken = (urlParams.get('room') || sessionStorage.getItem('skawan_room') || 'SKASA').toUpperCase();
      document.getElementById('navRoomToken').innerText = currentRoomToken;

      initSwitcherSystem(currentRoomToken);
    });

    function initSwitcherSystem(token) {
      const db = getDatabase();
      if (!db) return;

      db.ref(`rooms/${token}/live_state`).on('value', snap => {
        if (!snap.exists()) return;
        const remote = snap.val();
        liveState.programSource = remote.programSource || 'cam_1';
        liveState.previewSource = remote.previewSource || 'cam_2';
        updateBusButtons();
        updateMonitors();
      });

      db.ref(`rooms/${token}/vt_state`).on('value', snap => {
        if (!snap.exists()) return;
        latestVtState = { ...latestVtState, ...snap.val() };
        syncSwitcherVt();
      });

      db.ref(`rooms/${token}/cg_state`).on('value', snap => {
        if (!snap.exists()) return;
        applyCgOverlay(snap.val());
      });

      if (typeof SkawanStreamer !== 'undefined') {
        streamerInstance = new SkawanStreamer({
          roomToken: token,
          roleKey: 'switcher',
          onRemoteStream: (camKey, stream) => {
            const normKey = camKey.includes('_') ? camKey : camKey.replace('cam', 'cam_');
            remoteCamStreams.set(normKey, stream);
            updateMonitors();
          }
        });
      }
    }

    function pilihBusLangsung(busType, key) {
      if (busType === 'pgm') liveState.programSource = key;
      else liveState.previewSource = key;
      broadcastLiveState();
    }

    function eksekusiCut() {
      const temp = liveState.programSource;
      liveState.programSource = liveState.previewSource;
      liveState.previewSource = temp;
      broadcastLiveState();
    }

    function eksekusiAuto() { eksekusiCut(); }

    function broadcastLiveState() {
      const db = getDatabase();
      if (!db) return;
      db.ref(`rooms/${currentRoomToken}/live_state`).set({
        programSource: liveState.programSource,
        previewSource: liveState.previewSource,
        updatedAt: Date.now()
      });
    }

    function updateBusButtons() {
      ['cam_1', 'cam_2', 'cam_3', 'vt'].forEach(src => {
        const pgmBtn = document.getElementById(`btn-pgm-${src}`);
        const pvwBtn = document.getElementById(`btn-pvw-${src}`);
        if (pgmBtn) pgmBtn.className = src === liveState.programSource ? "atem-btn py-3 rounded-xl border btn-pgm-active font-bold text-xs" : "atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-bold text-xs";
        if (pvwBtn) pvwBtn.className = src === liveState.previewSource ? "atem-btn py-3 rounded-xl border btn-pvw-active font-bold text-xs" : "atem-btn py-3 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-bold text-xs";
      });
    }

    function updateMonitors() {
      const activeSrc = liveState.programSource || 'cam_1';
      document.getElementById('badgePgmSource').innerText = activeSrc.toUpperCase();
      document.getElementById('pgmScreenLabel').innerText = activeSrc.toUpperCase();

      const pgmVideo = document.getElementById('pgmCamVideo');
      const pgmFallback = document.getElementById('pgmFallbackBox');
      const pgmVtWrap = document.getElementById('pgmVtWrapper');

      if (activeSrc === 'vt') {
        if (pgmVideo) { pgmVideo.classList.remove('opacity-100'); pgmVideo.classList.add('opacity-0', 'pointer-events-none'); }
        if (pgmFallback) pgmFallback.classList.add('hidden');
        if (pgmVtWrap) { pgmVtWrap.classList.remove('opacity-0', 'pointer-events-none'); pgmVtWrap.classList.add('opacity-100'); pgmVtWrap.style.zIndex = '15'; }
      } else {
        if (pgmVtWrap) { pgmVtWrap.classList.remove('opacity-100'); pgmVtWrap.classList.add('opacity-0', 'pointer-events-none'); pgmVtWrap.style.zIndex = '0'; }
        const stream = remoteCamStreams.get(activeSrc) || remoteCamStreams.get(activeSrc.replace('_', ''));
        if (stream && pgmVideo) {
          if (pgmVideo.srcObject !== stream) pgmVideo.srcObject = stream;
          pgmVideo.classList.remove('opacity-0', 'pointer-events-none');
          pgmVideo.classList.add('opacity-100');
          pgmVideo.style.zIndex = '15';
          if (pgmFallback) pgmFallback.classList.add('hidden');
          pgmVideo.play().catch(() => {});
        } else {
          if (pgmVideo) { pgmVideo.classList.remove('opacity-100'); pgmVideo.classList.add('opacity-0', 'pointer-events-none'); }
          if (pgmFallback) pgmFallback.classList.remove('hidden');
        }
      }
    }

    function syncSwitcherVt() {
      const isPgmVt = liveState.programSource === 'vt';
      const ytWrap = document.getElementById('pgmVtYtWrap');
      if (ytWrap) {
        ytWrap.style.opacity = isPgmVt ? '1' : '0';
        ytWrap.style.zIndex = isPgmVt ? '10' : '0';
      }
    }

    function applyCgOverlay(cg) {
      const ltBox = document.getElementById('pgmLowerThirdBox');
      if (cg.lowerThirdActive) {
        ltBox.classList.remove('hidden');
        document.getElementById('pgmLtTitle').innerText = cg.title;
        document.getElementById('pgmLtSubtitle').firstElementChild.innerText = cg.subtitle;
      } else {
        ltBox.classList.add('hidden');
      }
    }

    function bukaModalKeluar() { window.location.href = 'login.html'; }
  </script>
</body>
</html>
