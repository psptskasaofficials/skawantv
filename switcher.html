<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKAWAN TV - Switcher</title>
  <!-- Masukkan CSS / Tailwind sesuai layout asli versi 1.0 Anda -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- ==========================================
       GANTI / SESUAIKAN BAGIAN HTML INI 
       DENGAN STRUKTUR LAYOUT ASLI VERSI 1.0 ANDA
       ========================================== -->
  <div class="container">
    <h1>SKAWAN TV - Switcher Control</h1>
    <p>Room: <span id="roomBadge">--</span></p>

    <!-- Area Tombol Switcher Asli Anda (Ditambah tombol ShareScreen) -->
    <div class="switcher-buttons">
      <button id="btnCam1" onclick="switchSource('cam_1')">Kamera 1</button>
      <button id="btnCam2" onclick="switchSource('cam_2')">Kamera 2</button>
      
      <!-- Tambahan Tombol ShareScreen (Mengikuti gaya tombol asli Anda) -->
      <button id="btnShare" onclick="startAndShareScreen()">Share Screen</button>
      
      <button id="btnStandby" onclick="switchSource('standby')">Standby</button>
    </div>

    <!-- Mini PGM Preview (Opsional sesuai layout asli) -->
    <div class="mini-pgm-preview">
      <div id="currentActiveLabel">Status: --</div>
    </div>
  </div>

  <!-- Skrip Logika Sinkronisasi Firebase & ShareScreen (Layout Tetap Aman) -->
  <script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Ambil Token Ruangan dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomToken = urlParams.get('room') || 'DEFAULT_ROOM';
    document.getElementById('roomBadge').textContent = roomToken;

    const liveStateRef = database.ref(`rooms/${roomToken}/live_state`);

    // 1. Fungsi Mengganti Sumber Video Utama ke Firebase
    function switchSource(sourceType) {
      liveStateRef.update({
        programSource: sourceType,
        isSharing: (sourceType === 'sharescreen'),
        lastUpdated: Date.now()
      }).catch((error) => {
        console.error("Gagal mengganti sumber:", error);
      });
    }

    // 2. Fungsi ShareScreen (Tanpa merusak layout)
    async function startAndShareScreen() {
      try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        
        // Kirim sinyal ke Firebase bahwa source aktif adalah sharescreen
        switchSource('sharescreen');

        // Jika pengguna menutup share screen dari browser, kembalikan ke kamera 1
        screenStream.getVideoTracks()[0].onended = function () {
          switchSource('cam_1');
        };
      } catch (error) {
        console.error("ShareScreen dibatalkan:", error);
      }
    }

    // 3. Listener Real-time untuk Sinkronisasi Status Tally / Tombol Aktif
    liveStateRef.on('value', (snapshot) => {
      if (!snapshot.exists()) return;
      const state = snapshot.val();
      const activeSource = state.programSource || 'cam_1';

      // Update label status
      const label = document.getElementById('currentActiveLabel');
      if (label) label.textContent = `Status: ${activeSource.toUpperCase()}`;

      // Indikator visual tombol aktif (Opsional: sesuaikan kelas CSS dengan versi 1.0 Anda)
      const buttons = {
        'cam_1': document.getElementById('btnCam1'),
        'cam_2': document.getElementById('btnCam2'),
        'sharescreen': document.getElementById('btnShare'),
        'standby': document.getElementById('btnStandby')
      };

      Object.keys(buttons).forEach(key => {
        const btn = buttons[key];
        if (btn) {
          if (key === activeSource) {
            btn.style.border = "2px solid red"; // Penanda sederhana aktif (bisa diganti class CSS asli)
          } else {
            btn.style.border = "none";
          }
        }
      });
    });
  </script>
</body>
</html>
