<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kamera Juru Kamera | SKAWAN TV</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Montserrat, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="icon" href="assets/img/logo-skawan-icon.webp" type="image/webp">
  <link rel="shortcut icon" href="logo-skawan-icon.webp" type="image/webp">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            brand: ['Montserrat', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            skawan: {
              red: '#E50914',
              orange: '#EA580C',
              darkBg: '#080C14',
              cardDark: '#0F172A',
              borderDark: '#1E293B'
            }
          }
        }
      }
    }
  </script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    (function ensureFirebaseConnection() {
      const config = {
        apiKey: "AIzaSyAtSTgrBWY5aDahE6hq_yr4oSxpxl3QtcQ",
        authDomain: "skawan-tv.firebaseapp.com",
        databaseURL: "https://skawan-tv-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "skawan-tv",
        storageBucket: "skawan-tv.firebasestorage.app",
        messagingSenderId: "501619282826",
        appId: "1:501619282826:web:81e624ac35e9798062ae73"
      };
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps || !firebase.apps.length) {
          try { firebase.initializeApp(config); } catch (e) {}
        }
        if (!window.db && firebase.database) {
          window.db = firebase.database();
        }
      }
    })();
  </script>

  <!-- WebRTC Streamer Engine -->
  <script src="js/webrtc-stream.js"></script>

  <style>
    body, html {
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    .tally-live {
      box-shadow: inset 0 0 0 8px #dc2626, 0 0 30px rgba(220, 38, 38, 0.8);
      border-color: #dc2626 !important;
    }
    .tally-cue {
      box-shadow: inset 0 0 0 8px #10b981, 0 0 30px rgba(16, 185, 129, 0.7);
      border-color: #10b981 !important;
    }
    .touch-btn {
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active {
      transform: scale(0.92);
    }
    @keyframes cue-flash {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
    .director-cue-alert {
      animation: cue-flash 0.8s infinite;
    }
  </style>
</head>
<body class="flex flex-col justify-between text-white select-none">

  <!-- FRAME VIEWPORT KAMERA DENGAN TALLY BORDER -->
  <div id="cameraViewport" class="absolute inset-0 w-full h-full border-4 border-slate-900 transition-all duration-300 flex items-center justify-center overflow-hidden">
    <video id="camVideoPreview" class="w-full h-full object-cover" autoplay playsinline muted></video>

    <!-- Overlay Fallback -->
    <div id="camFallbackBox" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 p-6 text-center space-y-3">
      <span class="text-6xl animate-bounce">📹</span>
      <h2 class="font-brand font-black text-xl text-white">Kamera Belum Aktif</h2>
      <p class="text-xs font-mono text-slate-400 max-w-xs">
        Izinkan akses kamera pada peramban Anda untuk mulai menyiarkan visual ke ruang kontrol.
      </p>
      <button onclick="mulaiKamera()" class="touch-btn px-6 py-3 rounded-2xl bg-gradient-to-r from-red-600 to-orange-600 font-brand font-black text-sm text-white shadow-xl shadow-red-600/30">
        Buka Akses Kamera
      </button>
    </div>
  </div>

  <!-- HUD ATAS: IDENTITAS KAMERA, RESOLUSI AKTIF, & TALLY STATUS -->
  <header class="relative z-20 p-3 sm:p-4 flex items-center justify-between bg-gradient-to-b from-black/80 via-black/40 to-transparent">
    <div class="flex items-center gap-2">
      <div id="badgeCamId" class="px-3 py-1 rounded-xl bg-slate-900/90 border border-slate-700 text-white font-mono font-black text-xs sm:text-sm tracking-wider shadow">
        CAM 1
      </div>
      <div id="badgeTallyStatus" class="px-3 py-1 rounded-xl bg-slate-900/90 border border-slate-700 text-slate-400 font-mono font-bold text-xs uppercase shadow">
        STANDBY
      </div>
    </div>

    <!-- Pilihan Resolusi, Info Ruangan, & Keluar -->
    <div class="flex items-center gap-2">
      <!-- Selector Custom Resolusi -->
      <div class="bg-black/70 backdrop-blur-md rounded-xl border border-white/20 px-2 py-0.5 flex items-center gap-1 shadow">
        <span class="text-[10px] font-mono text-slate-400">RES:</span>
        <select id="selectResolution" onchange="ubahResolusiKamera(this.value)" class="bg-transparent text-amber-400 font-mono font-bold text-xs outline-none cursor-pointer">
          <option value="360" class="bg-slate-900 text-white">360p (SD)</option>
          <option value="720" selected class="bg-slate-900 text-white">720p (HD)</option>
          <option value="1080" class="bg-slate-900 text-white">1080p (FHD)</option>
        </select>
      </div>

      <div class="bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/10 text-[11px] font-mono font-bold text-amber-400">
        <span id="txtRoomLabel">SKASA</span>
      </div>
      <button onclick="keluarKeLogin()" class="touch-btn bg-black/60 backdrop-blur-md border border-white/10 text-rose-400 p-1.5 rounded-lg text-xs" title="Keluar">
        🚪
      </button>
    </div>
  </header>

  <!-- BANNER CUE ABA-ABA DARI SUTRADARA (PD) -->
  <div id="boxDirectorCueAlert" class="hidden relative z-20 mx-3 sm:mx-6 p-3 rounded-2xl bg-amber-500/95 text-slate-950 shadow-2xl backdrop-blur-md director-cue-alert">
    <div class="flex items-center justify-between">
      <span class="text-[9px] font-mono font-black uppercase tracking-wider">ABA-ABA SUTRADARA (PD):</span>
      <span class="text-[9px] font-mono font-bold" id="lblCueTimer">SEKARANG</span>
    </div>
    <p id="txtCueMessage" class="font-brand font-black text-sm sm:text-base leading-tight mt-0.5">
      Standby Host! Bersiap transisi!
    </p>
  </div>

  <!-- HUD BAWAH: STATUS FRAME/FPS, WAKE LOCK, & KONTROL KAMERA -->
  <footer class="relative z-20 p-3 sm:p-4 flex items-center justify-between bg-gradient-to-t from-black/90 via-black/50 to-transparent">
    <div class="flex items-center gap-2">
      <div class="text-[10px] font-mono text-slate-300 bg-black/60 px-2.5 py-1 rounded-lg border border-white/10">
        <span id="lblWakeLockStatus">🔒 Anti-Sleep Aktif</span>
      </div>
      <div class="hidden sm:block text-[10px] font-mono text-emerald-400 bg-black/60 px-2 py-1 rounded-lg border border-white/10" id="lblRealResolution">
        1280x720
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Tombol Balik Kamera Depan / Belakang -->
      <button id="btnSwitchCamera" onclick="gantiArahKamera()" class="touch-btn bg-black/70 backdrop-blur-md hover:bg-black text-white px-3.5 py-2 rounded-xl border border-white/20 text-xs font-bold font-mono flex items-center gap-1.5 shadow-lg">
        <span>🔄</span>
        <span class="hidden sm:inline">Pindah Kamera</span>
      </button>

      <!-- Tombol Mute / Suara Kamera -->
      <button id="btnToggleAudio" onclick="toggleAudio()" class="touch-btn bg-black/70 backdrop-blur-md hover:bg-black text-white px-3 py-2 rounded-xl border border-white/20 text-xs font-mono">
        <span id="iconAudio">🔇 Mic Off</span>
      </button>
    </div>
  </footer>

  <script>
    let currentRoomToken = 'SKASA';
    let currentCamId = '1';
    let streamerInstance = null;
    let localStream = null;
    let wakeLockSentinel = null;

    let currentFacingMode = 'environment';
    let currentResolution = '720';
    let isAudioEnabled = false;

    const RESOLUTION_PRESETS = {
      '360': { width: 640, height: 360 },
      '720': { width: 1280, height: 720 },
      '1080': { width: 1920, height: 1080 }
    };

    function getDatabase() {
      return window.db || (typeof firebase !== 'undefined' && firebase.database ? firebase.database() : null);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentRoomToken = (urlParams.get('room') || localStorage.getItem('skawan_room') || 'SKASA').toUpperCase();
      currentCamId = urlParams.get('cam') || '1';

      document.getElementById('txtRoomLabel').innerText = currentRoomToken;
      document.getElementById('badgeCamId').innerText = `CAM ${currentCamId}`;

      aktifkanWakeLock();
      mulaiKamera();
      listenStudioTally(currentRoomToken, `cam_${currentCamId}`);
      listenDirectorCue(currentRoomToken);
    });

    async function aktifkanWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          document.getElementById('lblWakeLockStatus').innerText = "🔒 Anti-Sleep Aktif";
          wakeLockSentinel.addEventListener('release', () => {
            document.getElementById('lblWakeLockStatus').innerText = "🔓 Sleep Biasa";
          });
        } catch (err) {
          document.getElementById('lblWakeLockStatus').innerText = "⚠️ Anti-Sleep Nonaktif";
        }
      }
    }

    async function mulaiKamera() {
      try {
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
        }

        const preset = RESOLUTION_PRESETS[currentResolution] || RESOLUTION_PRESETS['720'];

        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: preset.width },
            height: { ideal: preset.height },
            aspectRatio: { ideal: 1.777777778 }
          },
          audio: isAudioEnabled
        };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);

        const videoEl = document.getElementById('camVideoPreview');
        videoEl.srcObject = localStream;
        document.getElementById('camFallbackBox').classList.add('hidden');

        // Baca resolusi riil yang didukung sensor perangkat
        const vTrack = localStream.getVideoTracks()[0];
        if (vTrack) {
          const settings = vTrack.getSettings();
          const lblReal = document.getElementById('lblRealResolution');
          if (lblReal) {
            lblReal.innerText = `${settings.width || preset.width}x${settings.height || preset.height}`;
          }
        }

        // WebRTC Streamer
        const camRoleKey = `cam_${currentCamId}`;
        if (!streamerInstance && typeof SkawanStreamer !== 'undefined') {
          streamerInstance = new SkawanStreamer({
            roomToken: currentRoomToken,
            roleKey: camRoleKey
          });
        }

        if (streamerInstance) {
          streamerInstance.publishStream(camRoleKey, localStream);
        }

        const studentName = localStorage.getItem('skawan_user') || `Juru Kamera ${currentCamId}`;
        const activeDb = getDatabase();
        if (activeDb) {
          activeDb.ref(`rooms/${currentRoomToken}/roles/${camRoleKey}`).set(studentName);
        }

      } catch (err) {
        console.warn("Gagal membuka kamera:", err);
        document.getElementById('camFallbackBox').classList.remove('hidden');
      }
    }

    // Ubah Resolusi Dinamis
    async function ubahResolusiKamera(val) {
      if (!RESOLUTION_PRESETS[val]) return;
      currentResolution = val;
      await mulaiKamera();
    }

    async function gantiArahKamera() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      await mulaiKamera();
    }

    function toggleAudio() {
      isAudioEnabled = !isAudioEnabled;
      const icon = document.getElementById('iconAudio');
      icon.innerText = isAudioEnabled ? '🔊 Mic On' : '🔇 Mic Off';
      mulaiKamera();
    }

    function listenStudioTally(token, camKey) {
      const activeDb = getDatabase();
      if (!activeDb) {
        setTimeout(() => listenStudioTally(token, camKey), 300);
        return;
      }

      activeDb.ref(`rooms/${token}/live_state`).on('value', snap => {
        const state = snap.val() || {};
        const pgmSrc = state.programSource || 'cam_1';
        const pvwSrc = state.previewSource || 'cam_2';

        const isLive = (pgmSrc === camKey);
        const isCue = (pvwSrc === camKey);

        updateTallyBorder(isLive, isCue);
      });
    }

    function updateTallyBorder(isLive, isCue) {
      const viewport = document.getElementById('cameraViewport');
      const badge = document.getElementById('badgeTallyStatus');

      if (isLive) {
        viewport.className = "absolute inset-0 w-full h-full border-8 tally-live transition-all duration-200 flex items-center justify-center overflow-hidden";
        badge.className = "px-3 py-1 rounded-xl bg-red-600 text-white font-mono font-black text-xs uppercase shadow animate-pulse";
        badge.innerText = "● LIVE ON-AIR";

        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else if (isCue) {
        viewport.className = "absolute inset-0 w-full h-full border-8 tally-cue transition-all duration-200 flex items-center justify-center overflow-hidden";
        badge.className = "px-3 py-1 rounded-xl bg-emerald-600 text-black font-mono font-black text-xs uppercase shadow";
        badge.innerText = "CUE / STANDBY";
      } else {
        viewport.className = "absolute inset-0 w-full h-full border-4 border-slate-900 transition-all duration-200 flex items-center justify-center overflow-hidden";
        badge.className = "px-3 py-1 rounded-xl bg-slate-900/90 border border-slate-700 text-slate-400 font-mono font-bold text-xs uppercase shadow";
        badge.innerText = "OFF";
      }
    }

    function listenDirectorCue(token) {
      const activeDb = getDatabase();
      if (!activeDb) return;

      activeDb.ref(`rooms/${token}/pd_state`).on('value', snap => {
        const pd = snap.val() || {};
        if (pd.directorCue) {
          tampilkanDirectorCue(pd.directorCue);
        }
      });
    }

    function tampilkanDirectorCue(msg) {
      const box = document.getElementById('boxDirectorCueAlert');
      const txt = document.getElementById('txtCueMessage');
      txt.innerText = msg;
      box.classList.remove('hidden');

      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      setTimeout(() => {
        box.classList.add('hidden');
      }, 7000);
    }

    function keluarKeLogin() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      const activeDb = getDatabase();
      if (activeDb) {
        activeDb.ref(`rooms/${currentRoomToken}/roles/cam_${currentCamId}`).set("");
      }
      window.location.href = `login.html?room=${currentRoomToken}`;
    }

    window.addEventListener('beforeunload', () => {
      keluarKeLogin();
      if (streamerInstance) streamerInstance.destroy();
    });
  </script>
</body>
</html>
